<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>モンサクン 教員用</title>
<style>
/* 教員用ページの見た目。作問画面とは別の、事務作業向けの落ち着いた配色。 */
:root {
  --bg: #f4f1e6; --panel: #fffdf6; --ink: #1f1d17; --muted: #6b665a; --line: #d9d2bd;
  --accent: #b4561f; --accent-ink: #fff; --ok: #1d7a46; --warn: #a86a00; --ng: #b3261e; --sel: #fbe9c8;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif; }
[hidden] { display: none !important; }
button { font: inherit; padding: 6px 12px; border: 1px solid var(--line); background: #fff; border-radius: 6px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.danger { color: var(--ng); }
button.link { border: none; background: none; color: var(--accent); padding: 0 4px; text-decoration: underline; }
input, select, textarea { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: #fff; min-width: 0; }
textarea { width: 100%; resize: vertical; }

.bar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 10px 16px; background: #2c2a24; color: #f4f1e6; }
.bar h1 { margin: 0; font-size: 18px; }
.bar h1 span { font-size: 13px; font-weight: normal; opacity: .8; margin-left: 4px; }
.tabs { display: flex; gap: 4px; }
.tabs button { background: transparent; color: #f4f1e6; border-color: #6b665a; }
.tabs button.on { background: #f4f1e6; color: #2c2a24; }
.who { margin-left: auto; font-size: 12px; opacity: .9; }
.who .link { color: #ffd59a; }

main { padding: 16px; max-width: 1400px; margin: 0 auto; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
.narrow { max-width: 480px; margin: 40px auto; text-align: center; }
.gbtn { display: flex; justify-content: center; margin: 18px 0 8px; min-height: 44px; }
.note { color: var(--muted); font-size: 13px; margin: 4px 0; }
.msg { min-height: 1.4em; color: var(--ng); }
h2 { font-size: 16px; margin: 0 0 8px; }
h3 { font-size: 14px; margin: 16px 0 6px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.buttons { display: flex; gap: 8px; flex-wrap: wrap; }
.state b { color: var(--accent); }
.state .dirty { color: var(--warn); font-weight: bold; margin-left: 8px; }

.cols { display: grid; grid-template-columns: 300px 1fr; gap: 12px; align-items: start; }
.list { max-height: calc(100vh - 190px); overflow: auto; padding: 8px; }
.list h4 { margin: 10px 4px 4px; font-size: 13px; color: var(--muted); }
.item { display: grid; grid-template-columns: 44px 1fr 18px; gap: 6px; align-items: center; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.item:hover { background: #f5efdd; }
.item.on { background: var(--sel); }
.item .no { font-weight: bold; }
.item .sum { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mark-ok { color: var(--ok); } .mark-warn { color: var(--warn); } .mark-ng { color: var(--ng); }

.editor .row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 6px 0; }
.editor label { display: inline-flex; gap: 6px; align-items: center; }
.editor input.n { width: 56px; text-align: center; }
.editor input.w { width: 120px; }
.req-preview { border: 3px solid #000; background: #fff; padding: 8px 12px; font-weight: bold; white-space: pre-line; max-width: 420px; }
.cards { width: 100%; border-collapse: collapse; margin-top: 4px; }
.cards th, .cards td { border-bottom: 1px solid var(--line); padding: 6px 4px; vertical-align: top; text-align: left; }
.cards th { font-size: 12px; color: var(--muted); font-weight: normal; }
.cards td.attrs { display: flex; flex-wrap: wrap; gap: 4px; }
.cards td.attrs input { width: 96px; }
.cards td.attrs input.n { width: 48px; }
.cards td.attrs input.u { width: 52px; }
.cards td.txt { min-width: 200px; }
.cards td.txt textarea { min-height: 38px; }
.cards .ops { white-space: nowrap; }
.cards .ops button { padding: 2px 6px; }
.check { margin-top: 12px; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
.check.ok { border-color: var(--ok); }
.check.ng { border-color: var(--ng); }
.check ul { margin: 4px 0 0; padding-left: 20px; }
.check .ng li { color: var(--ng); }
.check .warn li { color: var(--warn); }
.editor .foot { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

.opts { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 10px 0; }
.days { border-collapse: collapse; margin: 8px 0 12px; min-width: 320px; }
.days th, .days td { border-bottom: 1px solid var(--line); padding: 6px 12px; text-align: left; }
.days td.num { text-align: right; font-variant-numeric: tabular-nums; }

.toast { position: fixed; right: 16px; bottom: 16px; background: #2c2a24; color: #fff; padding: 10px 14px; border-radius: 6px; z-index: 10; max-width: 420px; }

@media (max-width: 860px) {
  .cols { grid-template-columns: 1fr; }
  .list { max-height: 260px; }
  .cards thead { display: none; }
  .cards tr { display: grid; grid-template-columns: 1fr; border-bottom: 2px solid var(--line); }
  .cards td { border: none; }
}
</style>

    <h2>教員の Google アカウントでログイン</h2>

    <div id="gbtn" class="gbtn"></div>
    <p id="loginmsg" class="msg"></p>
  </section>

    <div class="toolbar panel">
      <div class="state" id="state"></div>
      <div class="buttons">
        <button id="import">既定の 48 課題を取り込む</button>

      <button id="reloadDays">一覧を読み直す</button>

    </div>
    <p id="logmsg" class="msg"></p>
  </section>
</main>

<div id="toast" class="toast" hidden></div>

<script>
/*
 * GAS（ログ受信用ウェブアプリ）との通信。
 *
 * Content-Type を text/plain にして「単純なリクエスト」にする。application/json にすると
 * ブラウザが事前確認（OPTIONS）を送り、GAS はそれに答えられないので失敗する。
 * GAS の応答は script.googleusercontent.com への転送を経て返り、こちらはそれをそのまま読む。
 */
var API = (function () {
  function post(body) {
    return fetch(MSK_CONFIG.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body),
    }).then(function (r) {
      if (!r.ok) throw new Error('通信エラー（HTTP ' + r.status + '）');
      return r.json();
    }).then(function (j) {
      if (!j.ok) {
        var err = new Error(j.error || 'エラー');
        err.code = j.code;
        throw err;
      }
      return j;
    });
  }
  return {
    login: function (idToken) { return post({ action: 'login', idToken: idToken }); },
    resume: function (session) { return post({ action: 'resume', session: session }); },
    log: function (session, events) { return post({ action: 'log', session: session, events: events }); },
    // 教員用
    tasksLoad: function (session) { return post({ action: 'tasks.load', session: session }); },
    tasksSave: function (session, tasks, baseVersion) {
      return post({ action: 'tasks.save', session: session, tasks: tasks, baseVersion: baseVersion });
    },
    logsIndex: function (session) { return post({ action: 'logs.index', session: session }); },
    logsCsv: function (session, date, columns, withEmail) {
      return post({ action: 'logs.csv', session: session, date: date, columns: columns, withEmail: withEmail });
    },
  };
})();
</script>

<script>
var MSK = (function () {
  var module = { exports: {} };
'use strict';
/**
 * モンサクン 5 制約（C.S / N.S / SS.S / ST.S / O.S）の判定エンジン。
 *
 * 制約の呼称は data/00_元データ/README.md と CLAUDE.md の canonical 定義に従う。
 *
 *   SS.S 文構造制約       : 存在文 2 枚 ＋ 関係文 1 枚という構成が成立しているか
 *   ST.S 物語制約         : 関係文の種類が課題の指定する物語と対応しているか（SS.S に依存）
 *   O.S  オブジェクト制約 : 参照対象が規則に従うか（合併・比較 = 別物 / 増加・減少 = 同物）
 *   N.S  数理制約         : 出題が指定した数字を実際に使っているか
 *                          （Lv1 だけは緩く，置いた 3 枚の数が算術的に整合していれば充足）
 *   C.S  数式制約         : 物語が表す数量関係が作問条件の式と一致するか（N.S に依存）
 *
 * 判定規則は「正解カードなら満たす」だけでなく、**実践で使われた実システムが記録した
 * フラグを再現する** ことを目標に決めてある。各規則の細部（O.S を SS.S と独立に評価する、
 * 文順序の要求を ST.S ではなく C.S に置く、Lv1 の N.S だけ緩い、など）は
 * 寺西小 2020 実践の CHECK イベント 63,603 件と突き合わせて決定した。
 * 一致率は `node tools/validate.js` で再現できる。
 */

const STORY_LABEL = {
  combine: 'あわせて（合併）',
  increase: 'ふえると（増加）',
  decrease: 'のこりは（減少）',
  compare: 'ちがいは（比較）',
};

/** 物語タイプが導く数量関係の形（加算形か減算形か） */
const STORY_FORM = { combine: '+', increase: '+', decrease: '-', compare: '-' };

const FLAGS = ['SS.S', 'ST.S', 'O.S', 'N.S', 'C.S'];

const DEFAULT_OPTS = {
  // N.S の規則。'hybrid' が実ログと最もよく一致する（Lv1 のみ緩い）。
  //   'strict'  … 作問条件で指定された数値をそのまま使っているか
  //   'lenient' … 未知数 1 つを含む算術的に成立する数の組か
  //   'hybrid'  … Lv1 は lenient、Lv2・Lv3 は strict
  nsRule: 'hybrid',
};

// ---------------------------------------------------------------------------
// 補助
// ---------------------------------------------------------------------------

/** カードが言及するオブジェクトの一覧 */
function cardObjects(c) {
  if (!c) return [];
  if (c.kind === 'exist') return [c.obj];
  if (c.rel === 'combine') return c.objs.slice();
  if (c.rel === 'compare') return [c.subj, c.ref];
  return [c.obj]; // increase / decrease
}

function sameMultiset(a, b) {
  if (a.length !== b.length) return false;
  const x = a.slice().sort();
  const y = b.slice().sort();
  return x.every((v, i) => v === y[i]);
}

/**
 * 置かれた 3 枚から物語の数量関係を復元する。
 * 返り値 { form, x, y, z, rel } は「x form y = z」を意味する。
 *   合併 : 部分 + 部分 = 全体
 *   増加 : 変化前 + 増加量 = 変化後
 *   減少 : 変化前 - 減少量 = 変化後
 *   比較 : 多い方 - 少ない方 = 差
 * 増加・減少では、存在文のうちスロット順で先にある方を「変化前」とみなす。
 * 復元できない場合は null。
 */
function storyEquation(cards, slots) {
  const placed = slots.map((id) => (id ? cards[id - 1] : null));
  if (placed.some((c) => !c)) return null;
  const rels = placed.filter((c) => c.kind === 'rel');
  const eOrder = placed.filter((c) => c.kind === 'exist');
  if (rels.length !== 1 || eOrder.length !== 2) return null;
  const rel = rels[0];

  if (rel.rel === 'combine') {
    return { form: '+', x: eOrder[0].num, y: eOrder[1].num, z: rel.num, rel: 'combine',
             roles: { part1: eOrder[0], part2: eOrder[1], total: rel } };
  }
  if (rel.rel === 'increase') {
    return { form: '+', x: eOrder[0].num, y: rel.num, z: eOrder[1].num, rel: 'increase',
             roles: { before: eOrder[0], change: rel, after: eOrder[1] } };
  }
  if (rel.rel === 'decrease') {
    return { form: '-', x: eOrder[0].num, y: rel.num, z: eOrder[1].num, rel: 'decrease',
             roles: { before: eOrder[0], change: rel, after: eOrder[1] } };
  }
  if (rel.rel === 'compare') {
    // 「A は B より D おおい」→ A が多い方。「A は B より D すくない」→ B が多い方。
    const bigObj = rel.dir === 'more' ? rel.subj : rel.ref;
    const smallObj = rel.dir === 'more' ? rel.ref : rel.subj;
    const big = eOrder.find((c) => c.obj === bigObj);
    const small = eOrder.find((c) => c.obj === smallObj);
    if (!big || !small || big === small) return null; // 参照先の存在文が置かれていない
    return { form: '-', x: big.num, y: small.num, z: rel.num, rel: 'compare',
             roles: { larger: big, smaller: small, diff: rel } };
  }
  return null;
}

/**
 * 3 つの数量からなる加法的関係の正準形。
 *
 * 「x + y = z」も「x - y = z」も、結局は「全体 = 部分 + 部分」という 1 つの関係である。
 * 差の書き方は一意ではない（8-2=6 と 8-6=2 は同じ関係）ので、
 *   加算形 x + y = z → { whole: z, parts: [x, y] }
 *   減算形 x - y = z → { whole: x, parts: [y, z] }
 * に畳んでから比較する。これにより「2+7=?」と「2+?=7」は別物として区別しつつ、
 * 「?-6=2」と「?-2=6」は同じ関係として同一視できる。
 *
 * Why: 原データの作問条件では比較（ちがいは）の課題で差の書き方が揺れている
 * （Lv2 番号10 は「6-?=4」＝全体-部分、Lv2 番号12 は「?-6=2」＝全体-差）。
 * 表層の式で照合すると Lv2 番号12・Lv3 番号4 の正解が誤判定される。
 */
function canonical(form, x, y, z) {
  return form === '+'
    ? { whole: z, parts: [x, y].sort() }
    : { whole: x, parts: [y, z].sort() };
}

function sameRelation(r1, r2) {
  if (!r1 || !r2) return false;
  return r1.whole === r2.whole && sameMultiset(r1.parts, r2.parts);
}

/** 作問条件を正準形にする */
function requirementRelation(req) {
  if (req.mode === 'relation') return canonical(req.op, req.a, req.b, req.r);
  // 計算式条件: 未知数 ? を「a op b」で求める、という指定
  return req.op === '+'
    ? { whole: '?', parts: [req.a, req.b].sort() }
    : { whole: req.a, parts: [req.b, '?'].sort() };
}

/** 作問条件が要求する数値の組 */
function requiredNumbers(req) {
  return req.mode === 'relation' ? [req.a, req.b, req.r] : [req.a, req.b, '?'];
}

/** 未知数を 1 つ含むか、あるいは 3 数が「全体 = 部分 + 部分」を満たすか */
function arithmeticallyWellFormed(nums) {
  const q = nums.filter((n) => n === '?').length;
  if (q === 1) return true;           // 未知数がひとつ → 値を定めれば必ず成立する
  if (q > 1) return false;            // 未知数が 2 つ以上 → 数式が定まらない
  const d = nums.map(Number);
  return d[0] === d[1] + d[2] || d[1] === d[0] + d[2] || d[2] === d[0] + d[1];
}

// ---------------------------------------------------------------------------
// 本体
// ---------------------------------------------------------------------------

/**
 * @param {object} task    tasks.json の 1 課題
 * @param {number[]} slots 長さ 3。0 = 空、1..N = カード番号
 * @returns {{complete, flags, allSatisfied, reasons, equation}}
 */
function evaluate(task, slots, opts) {
  const o = Object.assign({}, DEFAULT_OPTS, opts || {});
  const cards = task.cards;
  const req = task.requirement;
  const flags = { 'SS.S': 0, 'ST.S': 0, 'O.S': 0, 'N.S': 0, 'C.S': 0 };
  const reasons = {};
  const complete = slots.every((s) => s > 0);
  if (!complete) {
    reasons.incomplete = 'カードが 3 枚そろっていない';
    return { complete: false, flags, allSatisfied: false, reasons, equation: null };
  }

  const placed = slots.map((id) => cards[id - 1]);
  const rels = placed.filter((c) => c.kind === 'rel');
  const exists = placed.filter((c) => c.kind === 'exist');
  const rel = rels.length === 1 ? rels[0] : null;
  const relSlot = placed.findIndex((c) => c.kind === 'rel');

  // --- SS.S 文構造制約 -----------------------------------------------------
  if (exists.length === 2 && rels.length === 1) {
    flags['SS.S'] = 1;
  } else {
    reasons['SS.S'] = `存在文 ${exists.length} 枚・関係文 ${rels.length} 枚になっている`
      + '（お話は「存在文 2 枚 ＋ 関係文 1 枚」で作る）';
  }

  // --- ST.S 物語制約（SS.S に依存） ---------------------------------------
  if (flags['SS.S']) {
    if (rel.rel === task.story) flags['ST.S'] = 1;
    else reasons['ST.S'] = `作ったお話は「${STORY_LABEL[rel.rel]}」だが、`
      + `課題が求めているのは「${STORY_LABEL[task.story]}」`;
  } else {
    reasons['ST.S'] = '文構造が成立していないので、お話の種類を判定できない';
  }

  // --- O.S オブジェクト制約 ------------------------------------------------
  // 実システムは SS.S とは独立に評価している（関係文の種類が「同物型」か「別物型」かで
  // 規則が決まり、関係文が無いときは 3 枚が同じものを指すかで判定する）。
  const eObjs = exists.map((c) => c.obj);
  if (rels.length === 1 && exists.length === 2) {
    const rObjs = Array.from(new Set(cardObjects(rel)));
    if (rel.rel === 'combine' || rel.rel === 'compare') {
      if (eObjs[0] === eObjs[1]) {
        reasons['O.S'] = `「${STORY_LABEL[rel.rel]}」のお話では、2 つの存在文は別のものでなければならない`;
      } else if (!sameMultiset(rObjs.slice().sort(), eObjs.slice().sort())) {
        reasons['O.S'] = '関係文が指しているものと、存在文に出てくるものが食い違っている';
      } else {
        flags['O.S'] = 1;
      }
    } else {
      if (eObjs[0] === eObjs[1] && rObjs.every((x) => x === eObjs[0])) flags['O.S'] = 1;
      else reasons['O.S'] = `「${STORY_LABEL[rel.rel]}」のお話では、3 枚とも同じものの話でなければならない`;
    }
  } else if (rels.length === 0) {
    const all = placed.map((c) => c.obj);
    if (all.every((x) => x === all[0])) flags['O.S'] = 1;

<script>
/*
 * 課題づくりの道具（教員用ページで使う純粋関数。tools/test_gas.js からも呼ぶ）。
 *
 *   MSK_TOOLS.requirementText(task)  … 作問条件の文（「4+3=?」でけいさんできる「あわせていくつ」の…）
 *   MSK_TOOLS.cardText(card)         … カードの属性から文を作る（{text, display}）
 *   MSK_TOOLS.check(task)            … 判定エンジンで課題を検査する（{errors, warnings, solutions}）
 *   MSK_TOOLS.newTask(lv, asg)       … 新しい課題のひな形
 *   MSK_TOOLS.normalize(task)        … 保存前に派生する値（lvAsg、order、expression、thinking、カード番号）をそろえる
 *
 * 文の作り方は寺西小学校実践用作問課題（data/tasks.json）の文面に合わせた。属性（オブジェクト・数・関係の種類）が
 * 判定に使われ、文は児童に見せるだけなので、作った文は自由に直してよい。
 */
var MSK_TOOLS = (function () {
  var STORY_PHRASE = { combine: 'あわせていくつ', increase: 'ふえるといくつ', decrease: 'のこりはいくつ', compare: 'ちがいはいくつ' };
  var STORY_LABEL = { combine: '合併（あわせて）', increase: '増加（ふえると）', decrease: '減少（のこりは）', compare: '比較（ちがいは）' };

  function equation(q) {
    return q.mode === 'calc' ? q.a + q.op + q.b : q.a + q.op + q.b + '=' + q.r;
  }

  function requirementText(t) {
    var eq = equation(t.requirement), ph = STORY_PHRASE[t.story] || '';
    return {
      text: '「' + eq + '」でけいさんできる「' + ph + '」のおはなしをつくろう',
      display: '「' + eq + '」でけいさんできる\n「' + ph + '」の\nおはなしをつくろう',
    };
  }

  /** 属性 → 文。単位（ひき・本・こ など）は判定には使わず、文を作るためだけに持つ。 */
  function cardText(c) {
    var n = (c.num || '') + (c.unit || '');
    var parts;
    if (c.kind === 'exist') parts = [c.obj + ' が', n, c.pred || 'あります'];
    else if (c.rel === 'combine') parts = [(c.objs || [])[0] + ' と ' + (c.objs || [])[1] + ' は', 'あわせて ' + n, c.pred || 'あります'];
    else if (c.rel === 'increase') parts = [c.obj + ' が', n, c.verb || 'ふえました'];
    else if (c.rel === 'decrease') parts = [c.obj + ' が', n, c.verb || 'へりました'];
    else if (c.rel === 'compare') parts = [c.subj + ' は ' + c.ref + ' より', n, c.dir === 'less' ? 'すくないです' : 'おおいです'];
    else parts = [''];
    var display = parts.join(' ').replace(/\s+/g, ' ').trim();
    return { text: display.replace(/ /g, ''), display: display };
  }

  /** 文から単位を推定する（既定の課題は単位を属性に持たないため）。「しろいいぬ が 2ひき います」→「ひき」 */
  function inferUnit(c) {
    if (c.unit || !c.num) return c;
    var esc = String(c.num).replace(/[?]/g, '\\?');
    var m = (c.display || c.text || '').match(new RegExp('(^|\\s)' + esc + '([ぁ-んァ-ヶー一-龠]{1,3})(?=\\s|$)'));
    if (m) c.unit = m[2];
    return c;
  }

  function newTask(lv, asg) {
    var t = {
      lv: lv, asg: asg, story: 'combine', order: 0, tutorial: false, note: '',
      requirement: { mode: 'relation', op: '+', a: '2', b: '3', r: '?' },
      cards: [
        { kind: 'exist', obj: 'あかいはな', num: '2', unit: 'ほん', pred: 'さいています', correct: true },
        { kind: 'exist', obj: 'しろいはな', num: '3', unit: 'ほん', pred: 'さいています', correct: true },
        { kind: 'rel', rel: 'combine', objs: ['あかいはな', 'しろいはな'], num: '?', unit: 'ほん', pred: 'さいています', correct: true },
        { kind: 'exist', obj: 'あかいはな', num: '5', unit: 'ほん', pred: 'さいています', correct: false },
        { kind: 'rel', rel: 'increase', obj: 'あかいはな', num: '3', unit: 'ほん', verb: 'ふえました', correct: false },
      ],
    };
    t.cards.forEach(function (c) { var x = cardText(c); c.text = x.text; c.display = x.display; });
    var q = requirementText(t);
    t.requirement.text = q.text; t.requirement.display = q.display;
    return normalize(t);
  }

  /** 保存前にそろえる値。増加・減少は文の順序を問う（関係文はまん中）。 */
  function normalize(t) {
    var q = t.requirement;
    q.story = t.story;
    if (q.mode === 'calc') q.r = null;
    t.lv = Number(t.lv); t.asg = Number(t.asg);
    t.lvAsg = t.lv * 100 + t.asg;
    t.order = t.story === 'increase' || t.story === 'decrease' ? 1 : 0;
    t.expression = q.mode === 'calc' ? 'calc' : 'story';
    t.thinking = q.mode === 'relation' && q.r === '?' ? 'forward' : 'reverse';
    t.cards.forEach(function (c, i) {
      c.id = i + 1;
      if (c.kind === 'exist') { delete c.rel; delete c.objs; delete c.subj; delete c.ref; delete c.dir; delete c.verb; }
      else if (c.rel === 'combine') { delete c.obj; delete c.subj; delete c.ref; delete c.dir; delete c.verb; }
      else if (c.rel === 'compare') { delete c.obj; delete c.objs; delete c.pred; delete c.verb; }
      else { delete c.objs; delete c.subj; delete c.ref; delete c.dir; delete c.pred; }
      if (!c.display) c.display = c.text;
    });
    return t;
  }

  function permutations3(ids) {
    var out = [];
    ids.forEach(function (a) { ids.forEach(function (b) { ids.forEach(function (c) {
      if (a !== b && b !== c && a !== c) out.push([a, b, c]);
    }); }); });
    return out;
  }

  var NUM = /^(\?|\d{1,3})$/;

  /**
   * 課題の検査。errors があると児童が正解できない（または判定できない）課題。
   * solutions … 5 制約をすべて満たすカードの並び（[id, id, id]）の一覧。
   */
  function check(t) {
    var errors = [], warnings = [];
    var q = t.requirement || {};
    [['a', q.a], ['b', q.b]].concat(q.mode === 'calc' ? [] : [['r', q.r]]).forEach(function (x) {
      if (!NUM.test(String(x[1]))) errors.push('作問条件の ' + x[0] + ' は数字か ? にする（いまは「' + x[1] + '」）');
    });
    var qs = [q.a, q.b].concat(q.mode === 'calc' ? [] : [q.r]).filter(function (v) { return v === '?'; }).length;
    if (q.mode === 'relation' && qs !== 1) errors.push('関係式の作問条件には ? をちょうど 1 つ入れる');
    if (q.mode === 'calc' && qs !== 0) errors.push('計算式の作問条件には ? を入れない');
    if (!t.cards || t.cards.length < 3) errors.push('カードは 3 枚以上');
    (t.cards || []).forEach(function (c, i) {
      var name = 'カード ' + (i + 1);
      if (!NUM.test(String(c.num))) errors.push(name + '：数は数字か ? にする');
      if (c.kind === 'exist' && !c.obj) errors.push(name + '：ものの名前が空');
      if (c.rel === 'combine' && (!c.objs || !c.objs[0] || !c.objs[1])) errors.push(name + '：あわせる 2 つのものを入れる');
      if (c.rel === 'compare' && (!c.subj || !c.ref)) errors.push(name + '：くらべる 2 つのものを入れる');
      if ((c.rel === 'increase' || c.rel === 'decrease') && !c.obj) errors.push(name + '：ものの名前が空');
      if (!c.text) errors.push(name + '：文が空');
      else if (String(c.num) && String(c.text).indexOf(String(c.num)) < 0) {
        warnings.push(name + '：文に数「' + c.num + '」が出てこない（文を直すか「属性から作り直す」）');
      }
    });
    if (errors.length) return { errors: errors, warnings: warnings, solutions: [] };

    var task = normalize(JSON.parse(JSON.stringify(t)));
    var ids = task.cards.map(function (c) { return c.id; });
    var solutions = permutations3(ids).filter(function (s) { return MSK.evaluate(task, s).allSatisfied; });
    var marked = task.cards.filter(function (c) { return c.correct; }).map(function (c) { return c.id; });
    var sameSet = function (s) { return s.slice().sort().join() === marked.slice().sort().join(); };
    if (marked.length !== 3) {
      errors.push('正解のカードに 3 枚だけ印を付ける（いまは ' + marked.length + ' 枚）');
    } else if (!solutions.some(sameSet)) {
      // どの並びでも正解にならない：いちばん多くの制約を満たす並びで、足りない制約を示す
      var best = null;
      permutations3(marked).forEach(function (s) {
        var r = MSK.evaluate(task, s);
        var k = MSK.FLAGS.filter(function (f) { return r.flags[f]; }).length;
        if (!best || k > best.k) best = { k: k, r: r, s: s };
      });
      errors.push('正解の印を付けた 3 枚では、どの並びでも正解にならない');
      MSK.FLAGS.forEach(function (f) { if (best.r.reasons[f]) errors.push('　' + f + '：' + best.r.reasons[f]); });
    }
    var others = solutions.filter(function (s) { return !sameSet(s); });
    if (others.length) {
      warnings.push('印を付けていないカードの組み合わせでも正解になる（例：' + others[0].join('・') + ' 番）。正解が 2 通りある課題になる');
    }
    if (solutions.length && marked.length === 3 && task.order && solutions.filter(sameSet).length === 6) {
      warnings.push('並べる順序を問う課題なのに、どの順でも正解になる');
    }
    return { errors: errors, warnings: warnings, solutions: solutions };
  }

  return {
    STORY_LABEL: STORY_LABEL, requirementText: requirementText, cardText: cardText, inferUnit: inferUnit,
    newTask: newTask, normalize: normalize, check: check,
  };
})();
</script>

<script>
'use strict';
/*
 * モンサクン 教員用ページ（オーサリングツール）。
 *
 *   課題をつくる … 課題セット（管理シートの「課題」「カード」）を読み込み、編集して、丸ごと保存する。
 *                 カードの属性から文を作り、判定エンジンで「正解の 3 枚が 5 制約を満たすか」をその場で検査する。
 *   ログを書き出す … 日ごとのログファイルを選んで 1 つの CSV にまとめてダウンロードする。
 *
 * 教員かどうかはサーバが CONFIG.TEACHERS で確かめる（このページの表示だけでは何も変えられない）。
 */
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function el(tag, attrs, kids) {
  var n = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function (k) {
    var v = attrs[k];
    if (k === 'class') n.className = v;
    else if (k.indexOf('on') === 0) n.addEventListener(k.slice(2), v);
    else if (k === 'value') n.value = v;
    else if (k === 'checked' || k === 'selected' || k === 'disabled') n[k] = !!v;
    else n.setAttribute(k, v);
  });
  [].concat(kids || []).forEach(function (c) {
    if (c === null || c === undefined || c === false) return;
    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return n;
}
function clone(x) { return JSON.parse(JSON.stringify(x)); }

var KEY = 'monsakun:teacher-session';
var T = { session: null, email: '', tasks: null, version: '', dirty: false, sel: -1 };

// ---------------------------------------------------------------------------
// ログイン
// ---------------------------------------------------------------------------
function boot() {
  $$('#tabs button').forEach(function (b) { b.addEventListener('click', function () { showTab(b.dataset.tab); }); });
  $('#logout').addEventListener('click', function () {
    try { localStorage.removeItem(KEY); } catch (e) { /* 無視 */ }
    location.reload();
  });
  $('#import').addEventListener('click', importDefaults);
  $('#add').addEventListener('click', addTask);
  $('#save').addEventListener('click', saveAll);
  $('#reset').addEventListener('click', resetSet);
  $('#reloadDays').addEventListener('click', loadDays);
  $('#download').addEventListener('click', downloadCsv);
  $('#allDays').addEventListener('change', function (e) { $$('#days input').forEach(function (c) { c.checked = e.target.checked; }); });
  window.addEventListener('beforeunload', function (e) { if (T.dirty) { e.preventDefault(); e.returnValue = ''; } });
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) { /* 無視 */ }
  if (!saved) return showLogin();
  API.resume(saved).then(onLogin).catch(function () { showLogin(); });
}

function showLogin(msg) {
  $('#login').hidden = false;
  $('#loginmsg').textContent = msg || '';
  if (MSK_CONFIG.mockLogin) {
    $('#gbtn').innerHTML = '';
    $('#gbtn').appendChild(el('button', { onclick: function () { onCredential({ credential: 'preview' }); } }, '（プレビュー）ログイン'));
    return;
  }
  var tries = 0;
  (function draw() {
    if (!(window.google && google.accounts && google.accounts.id)) {
      if (++tries > 100) { $('#loginmsg').textContent = 'Google のログイン部品を読み込めませんでした。'; return; }
      return setTimeout(draw, 100);
    }
    google.accounts.id.initialize({ client_id: MSK_CONFIG.clientId, callback: onCredential, auto_select: false });
    $('#gbtn').innerHTML = '';
    google.accounts.id.renderButton($('#gbtn'), { theme: 'outline', size: 'large', text: 'signin_with', locale: 'ja' });
  })();
}

function onCredential(resp) {
  $('#loginmsg').textContent = 'ログインしています…';
  API.login(resp.credential).then(onLogin).catch(function (err) { $('#loginmsg').textContent = err.message; });
}

function onLogin(info) {
  if (!info.isTeacher) {
    try { localStorage.removeItem(KEY); } catch (e) { /* 無視 */ }
    return showLogin('このアカウント（' + info.email + '）は教員として登録されていません。');
  }
  try { localStorage.setItem(KEY, info.session); } catch (e) { /* 無視 */ }
  T.session = info.session;
  T.email = info.email;
  $('#login').hidden = true;
  $('#tabs').hidden = false;
  $('#logout').hidden = false;
  $('#who').textContent = info.email;
  showTab('tasks');
  loadTasks();
}

function showTab(name) {
  $$('#tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === name); });
  $('#tasks').hidden = name !== 'tasks';
  $('#logs').hidden = name !== 'logs';
  if (name === 'logs') loadDays();
}

function toast(msg) {
  var t = $('#toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(function () { t.hidden = true; }, 3500);
}

function apiError(err) {
  if (err.code === 'auth') {
    try { localStorage.removeItem(KEY); } catch (e) { /* 無視 */ }
    $('#tasks').hidden = true; $('#logs').hidden = true;
    return showLogin(err.message);
  }
  toast(err.message);
}

// ---------------------------------------------------------------------------
// 課題セット
// ---------------------------------------------------------------------------
function loadTasks() {
  $('#state').textContent = '読み込んでいます…';
  API.tasksLoad(T.session).then(function (r) {
    T.tasks = r.tasks;            // 無ければ null（児童には既定の 48 課題が出ている）
    T.version = r.version || '';
    T.dirty = false;
    T.sel = -1;
    (T.tasks || []).forEach(markAuto);
    render();
  }).catch(apiError);
}

/** 既定の 48 課題を取り込む。配信版には正解の印が無いので、判定エンジンで正解の 3 枚を求めて印を付ける。 */
function importDefaults() {
  if (T.tasks && T.tasks.length && !confirm('いま編集中の課題セットを、既定の 48 課題で置き換えます。よろしいですか？（保存するまでサーバには反映されません）')) return;
  T.tasks = clone(MSK_TASKS.tasks).map(function (t) {
    var ids = t.cards.map(function (c) { return c.id; });
    var sol = null;
    ids.forEach(function (a) { ids.forEach(function (b) { ids.forEach(function (c) {
      if (!sol && a !== b && b !== c && a !== c && MSK.evaluate(t, [a, b, c]).allSatisfied) sol = [a, b, c];
    }); }); });
    t.cards.forEach(function (c) { c.correct = !!sol && sol.indexOf(c.id) >= 0; });
    return t;
  });
  T.tasks.forEach(markAuto);
  T.dirty = true;
  T.sel = 0;
  render();
  toast('既定の 48 課題を取り込みました。「保存する」で児童の画面に反映されます。');
}

/** 自動で作った文かどうかを覚えておく（属性を変えたとき、自動の文なら作り直し、手で直した文は残す） */
function markAuto(t) {
  var q = MSK_TOOLS.requirementText(t);
  t._reqAuto = t.requirement.display === q.display;
  t.cards.forEach(function (c) {
    MSK_TOOLS.inferUnit(c);
    c._auto = !c.display || c.display === MSK_TOOLS.cardText(c).display;
  });
}

function addTask() {
  if (!T.tasks) T.tasks = [];
  var lv = T.sel >= 0 ? T.tasks[T.sel].lv : 1;
  var asg = 1 + T.tasks.filter(function (t) { return t.lv === lv; }).reduce(function (m, t) { return Math.max(m, t.asg); }, 0);
  var t = MSK_TOOLS.newTask(lv, asg);
  markAuto(t);
  T.tasks.push(t);
  sortTasks();
  T.sel = T.tasks.indexOf(t);
  T.dirty = true;
  render();
}

function sortTasks() {
  T.tasks.sort(function (a, b) { return (a.lv * 100 + Number(a.asg)) - (b.lv * 100 + Number(b.asg)); });
}

function stripForSave(t) {
  var x = clone(t);
  delete x._reqAuto;
  x.cards.forEach(function (c) { delete c._auto; });
  return MSK_TOOLS.normalize(x);
}

function saveAll() {
  if (!T.tasks) return toast('保存する課題セットがありません。');
  var bad = [];
  T.tasks.forEach(function (t) {
    var r = MSK_TOOLS.check(t);
    if (r.errors.length) bad.push(t.lv + '-' + t.asg + '：' + r.errors[0]);
  });
  var keys = {};
  T.tasks.forEach(function (t) {
    var k = t.lv + '-' + t.asg;
    if (keys[k]) bad.push(k + '：同じレベル・番号の課題が 2 つある');
    keys[k] = 1;
  });
  if (bad.length) return toast('直してから保存してください：' + bad.slice(0, 3).join(' ／ ') + (bad.length > 3 ? ' ほか' : ''));
  $('#save').disabled = true;
  API.tasksSave(T.session, T.tasks.map(stripForSave), T.version).then(function (r) {
    T.version = r.version;
    T.dirty = false;
    render();
    toast('保存しました（' + r.count + ' 課題）。児童の画面は次にログインしたときから新しい課題になります。');
  }).catch(apiError).then(function () { $('#save').disabled = false; });
}

function resetSet() {
  if (!confirm('サーバの課題セットを消し、児童の画面を既定の 48 課題に戻します。よろしいですか？')) return;
  API.tasksSave(T.session, [], T.version).then(function () {
    toast('課題セットを消しました。児童の画面は既定の 48 課題に戻ります。');
    loadTasks();
  }).catch(apiError);
}

// ---------------------------------------------------------------------------
// 描画：状態・一覧・編集
// ---------------------------------------------------------------------------
function render() {
  renderState();
  renderList();
  renderEditor();
}

/** 上の帯（課題セットの状態）だけを描き直す。入力中に編集欄を作り直すと入力の焦点が外れるので分けてある */
function renderState() {
  var st = $('#state');
  st.innerHTML = '';
  if (!T.tasks) {
    st.appendChild(el('span', {}, ['課題セットはまだありません（児童には ', el('b', {}, '既定の 48 課題'), ' が出ています）']));
  } else {
    st.appendChild(el('span', {}, ['課題セット：', el('b', {}, T.tasks.length + ' 課題'),
      T.version ? '（保存した版 ' + T.version + '）' : '（未保存）']));
    if (T.dirty) st.appendChild(el('span', { class: 'dirty' }, '保存していない変更があります'));
  }
  $('#reset').hidden = !T.version;
}

function statusOf(t) {
  var r = MSK_TOOLS.check(t);
  return r.errors.length ? 'ng' : r.warnings.length ? 'warn' : 'ok';
}

function renderList() {
  var box = $('#list');
  box.innerHTML = '';
  if (!T.tasks || !T.tasks.length) {
    box.appendChild(el('p', { class: 'note' }, '課題はまだありません。'));
    return;
  }
  var lastLv = null;
  T.tasks.forEach(function (t, i) {
    if (t.lv !== lastLv) { box.appendChild(el('h4', {}, 'レベル ' + t.lv)); lastLv = t.lv; }
    var s = statusOf(t);
    box.appendChild(el('div', {
      class: 'item' + (i === T.sel ? ' on' : ''), 'data-i': String(i),
      onclick: function () { T.sel = i; render(); },
    }, [
      el('span', { class: 'no' }, t.lv + '-' + t.asg),
      el('span', { class: 'sum' }, (t.tutorial ? '【例示】' : '') + MSK_TOOLS.STORY_LABEL[t.story].slice(0, 2) + '　'
        + (t.requirement.mode === 'calc' ? t.requirement.a + t.requirement.op + t.requirement.b
          : t.requirement.a + t.requirement.op + t.requirement.b + '=' + t.requirement.r)),
      el('span', { class: 'mark-' + s, title: s === 'ok' ? '検査 OK' : s === 'warn' ? '注意あり' : '直す必要あり' },
        s === 'ok' ? '✓' : s === 'warn' ? '!' : '✗'),
    ]));
  });
}

function changed(t, opts) {
  opts = opts || {};
  if (t._reqAuto) {
    var q = MSK_TOOLS.requirementText(t);
    t.requirement.text = q.text; t.requirement.display = q.display;
  }
  t.cards.forEach(function (c) {
    if (c._auto) { var x = MSK_TOOLS.cardText(c); c.text = x.text; c.display = x.display; }
  });
  T.dirty = true;
  if (opts.rebuild) renderEditor(); else { refreshCheck(t); refreshReq(t); }
  renderList();
  renderState();
}

function input(value, onInput, cls, attrs) {
  return el('input', Object.assign({ class: cls || '', value: value === null || value === undefined ? '' : value,
    oninput: function (e) { onInput(e.target.value); } }, attrs || {}));
}

function select(value, options, onChange) {
  return el('select', { onchange: function (e) { onChange(e.target.value); } }, options.map(function (o) {
    return el('option', { value: o[0], selected: o[0] === value }, o[1]);
  }));
}

function renderEditor() {
  var box = $('#editor');
  box.innerHTML = '';
  var t = T.tasks && T.tasks[T.sel];
  if (!t) {
    box.appendChild(el('p', { class: 'note' }, '左の一覧から課題を選ぶか、「＋ 新しい課題」で作ります。'));
    return;
  }
  var q = t.requirement;
  box.appendChild(el('h2', {}, '課題 ' + t.lv + '-' + t.asg));

  box.appendChild(el('div', { class: 'row' }, [
    el('label', {}, ['レベル', input(t.lv, function (v) { t.lv = Number(v) || 1; changed(t); }, 'n', { type: 'number', min: 1, max: 9 })]),
    el('label', {}, ['番号', input(t.asg, function (v) { t.asg = Number(v) || 1; changed(t); }, 'n', { type: 'number', min: 1, max: 99 })]),
    el('label', {}, ['お話の種類', select(t.story, [['combine', '合併（あわせて）'], ['increase', '増加（ふえると）'],
      ['decrease', '減少（のこりは）'], ['compare', '比較（ちがいは）']], function (v) { t.story = v; changed(t); })]),
    el('label', {}, [el('input', { type: 'checkbox', checked: t.tutorial, onchange: function (e) { t.tutorial = e.target.checked; changed(t); } }),
      '例示課題']),
  ]));
  box.appendChild(el('p', { class: 'note' }, '増加・減少は「変化前 → 変化 → 変化後」の順を問う（関係文はまん中）。合併・比較は順を問わない。'));

  box.appendChild(el('h3', {}, '作問条件'));
  box.appendChild(el('div', { class: 'row' }, [
    select(q.mode, [['relation', '関係式（例 4+3=?）'], ['calc', '計算式（例 4+3）']], function (v) {
      q.mode = v; if (v === 'calc') { q.r = null; } else if (!q.r) { q.r = '?'; } changed(t, { rebuild: true });
    }),
    input(q.a, function (v) { q.a = v.trim(); changed(t); }, 'n'),
    select(q.op, [['+', '+'], ['-', '−']], function (v) { q.op = v; changed(t); }),
    input(q.b, function (v) { q.b = v.trim(); changed(t); }, 'n'),
    q.mode === 'calc' ? null : el('span', {}, '='),
    q.mode === 'calc' ? null : input(q.r, function (v) { q.r = v.trim(); changed(t); }, 'n'),
    el('span', { class: 'note' }, '数字か ? を入れる'),
  ]));
  box.appendChild(el('div', { class: 'row' }, [
    el('label', { style: 'flex:1;min-width:260px' }, ['表示する文',
      el('textarea', { rows: 3, id: 'reqDisplay', oninput: function (e) {
        q.display = e.target.value; q.text = e.target.value.replace(/\s/g, ''); t._reqAuto = false; T.dirty = true; refreshReq(t);
      } }, q.display || '')]),
    el('div', {}, [el('div', { class: 'note' }, '児童に見える枠'), el('div', { class: 'req-preview', id: 'reqPreview' }, q.display || '')]),
    el('button', { onclick: function () { t._reqAuto = true; changed(t, { rebuild: true }); } }, '文を作り直す'),
  ]));

  box.appendChild(el('h3', {}, 'カード（' + t.cards.length + ' 枚）'));
  var tb = el('tbody');
  t.cards.forEach(function (c, i) { tb.appendChild(cardRow(t, c, i)); });
  box.appendChild(el('table', { class: 'cards' }, [
    el('thead', {}, el('tr', {}, ['番号', '正解', '種類', '属性（判定に使う）', '表示する文', ''].map(function (h) { return el('th', {}, h); }))),
    tb,
  ]));
  box.appendChild(el('div', { class: 'row' }, [
    el('button', { disabled: t.cards.length >= 8, onclick: function () {
      var c = { kind: 'exist', obj: '', num: '', unit: '', pred: 'あります', correct: false, _auto: true };
      t.cards.push(c); changed(t, { rebuild: true });
    } }, '＋ カードを足す'),
    el('span', { class: 'note' }, '正解のカード 3 枚に印を付ける（判定の検査に使う。児童には見えない）。カードは 3〜8 枚。'),
  ]));

  box.appendChild(el('div', { class: 'check', id: 'check' }));
  box.appendChild(el('div', { class: 'foot' }, [
    el('button', { onclick: function () {
      var c = clone(t); c.asg = 1 + T.tasks.filter(function (x) { return x.lv === t.lv; }).reduce(function (m, x) { return Math.max(m, x.asg); }, 0);
      T.tasks.push(c); sortTasks(); T.sel = T.tasks.indexOf(c); T.dirty = true; render();
    } }, 'この課題を複製'),
    el('button', { class: 'danger', onclick: function () {
      if (!confirm('課題 ' + t.lv + '-' + t.asg + ' を一覧から消します（保存するまでサーバには反映されません）。')) return;
      T.tasks.splice(T.sel, 1); T.sel = Math.min(T.sel, T.tasks.length - 1); T.dirty = true; render();
    } }, 'この課題を消す'),
  ]));
  refreshCheck(t);
}

var KIND_OPTIONS = [['exist', '存在文'], ['combine', '関係文：合併'], ['increase', '関係文：増加'],
  ['decrease', '関係文：減少'], ['compare', '関係文：比較']];

function cardRow(t, c, i) {
  var kindValue = c.kind === 'exist' ? 'exist' : c.rel;
  var f = function (key, label, cls) {
    return el('label', { title: label }, [el('span', { class: 'note' }, label),
      input(c[key], function (v) { c[key] = v; changed(t); }, cls)]);
  };
  var attrs;
  if (kindValue === 'exist') attrs = [f('obj', 'もの'), f('num', '数', 'n'), f('unit', '単位', 'u'), f('pred', 'ある様子')];
  else if (kindValue === 'combine') {
    if (!c.objs) c.objs = ['', ''];
    attrs = [
      el('label', {}, [el('span', { class: 'note' }, 'もの 1'), input(c.objs[0], function (v) { c.objs[0] = v; changed(t); })]),
      el('label', {}, [el('span', { class: 'note' }, 'もの 2'), input(c.objs[1], function (v) { c.objs[1] = v; changed(t); })]),
      f('num', '数', 'n'), f('unit', '単位', 'u'), f('pred', 'ある様子')];
  } else if (kindValue === 'compare') {
    attrs = [f('subj', 'くらべる方'), f('ref', 'くらべられる方'), f('num', '数', 'n'), f('unit', '単位', 'u'),
      el('label', {}, [el('span', { class: 'note' }, '多い／少ない'),
        select(c.dir || 'more', [['more', 'おおい'], ['less', 'すくない']], function (v) { c.dir = v; changed(t); })])];
  } else {
    attrs = [f('obj', 'もの'), f('num', '数', 'n'), f('unit', '単位', 'u'), f('verb', kindValue === 'increase' ? 'ふえ方' : 'へり方')];
  }
  return el('tr', {}, [
    el('td', {}, String(i + 1)),
    el('td', {}, el('input', { type: 'checkbox', checked: c.correct, title: '正解のカード',
      onchange: function (e) { c.correct = e.target.checked; changed(t); } })),
    el('td', {}, select(kindValue, KIND_OPTIONS, function (v) {
      if (v === 'exist') { c.kind = 'exist'; c.obj = c.obj || (c.objs || [])[0] || c.subj || ''; c.pred = c.pred || 'あります'; }
      else {
        c.kind = 'rel'; c.rel = v;
        if (v === 'combine') c.objs = c.objs || [c.obj || '', ''];
        if (v === 'compare') { c.subj = c.subj || c.obj || ''; c.ref = c.ref || ''; c.dir = c.dir || 'more'; }
        if (v === 'increase' || v === 'decrease') { c.obj = c.obj || (c.objs || [])[0] || ''; c.verb = v === 'increase' ? 'ふえました' : 'へりました'; }
      }
      c._auto = true;
      MSK_TOOLS.normalize({ requirement: {}, cards: [c] });
      changed(t, { rebuild: true });
    })),
    el('td', { class: 'attrs' }, attrs),
    el('td', { class: 'txt' }, [
      el('textarea', { rows: 2, 'data-card': String(i), oninput: function (e) {
        c.display = e.target.value; c.text = e.target.value.replace(/\s/g, ''); c._auto = false; T.dirty = true; refreshCheck(t);
      } }, c.display || ''),
      c._auto ? null : el('button', { class: 'link', onclick: function () { c._auto = true; changed(t, { rebuild: true }); } }, '属性から作り直す'),
    ]),
    el('td', { class: 'ops' }, [
      el('button', { title: '上へ', disabled: i === 0, onclick: function () { t.cards.splice(i - 1, 0, t.cards.splice(i, 1)[0]); changed(t, { rebuild: true }); } }, '↑'),
      el('button', { title: '下へ', disabled: i === t.cards.length - 1, onclick: function () { t.cards.splice(i + 1, 0, t.cards.splice(i, 1)[0]); changed(t, { rebuild: true }); } }, '↓'),
      el('button', { title: '消す', disabled: t.cards.length <= 3, onclick: function () { t.cards.splice(i, 1); changed(t, { rebuild: true }); } }, '×'),
    ]),
  ]);
}

/** 自動の文が変わったら、入力欄にも反映する（入力中の欄は触らない） */
function refreshReq(t) {
  var p = $('#reqPreview');
  if (p) p.textContent = t.requirement.display || '';
  var d = $('#reqDisplay');
  if (d && document.activeElement !== d && d.value !== t.requirement.display) d.value = t.requirement.display || '';
  t.cards.forEach(function (c, i) {
    var a = document.querySelector('textarea[data-card="' + i + '"]');
    if (a && document.activeElement !== a && a.value !== c.display) a.value = c.display || '';
  });
}

function refreshCheck(t) {
  var box = $('#check');
  if (!box) return;
  var r = MSK_TOOLS.check(t);
  box.className = 'check ' + (r.errors.length ? 'ng' : 'ok');
  box.innerHTML = '';
  if (!r.errors.length) {
    var orders = r.solutions.filter(function (s) {
      var marked = t.cards.map(function (c, i) { return c.correct ? i + 1 : 0; }).filter(Boolean).sort().join();
      return s.slice().sort().join() === marked;
    });
    box.appendChild(el('b', { class: 'mark-ok' }, '✓ 検査 OK'));
    box.appendChild(el('span', {}, '　正解になる並び：' + orders.map(function (s) { return s.join('-'); }).join('、')));
  } else {
    box.appendChild(el('b', { class: 'mark-ng' }, '✗ このままでは児童が正解できません'));
    box.appendChild(el('ul', { class: 'ng' }, r.errors.map(function (m) { return el('li', {}, m); })));
  }
  if (r.warnings.length) box.appendChild(el('ul', { class: 'warn' }, r.warnings.map(function (m) { return el('li', {}, m); })));
}

// ---------------------------------------------------------------------------
// ログの書き出し
// ---------------------------------------------------------------------------
function loadDays() {
  var tb = $('#days');
  tb.innerHTML = '';
  tb.appendChild(el('tr', {}, el('td', { colspan: 3, class: 'note' }, '読み込んでいます…')));
  API.logsIndex(T.session).then(function (r) {
    tb.innerHTML = '';
    if (!r.days.length) tb.appendChild(el('tr', {}, el('td', { colspan: 3, class: 'note' }, 'まだログはありません。')));
    r.days.forEach(function (d) {
      var ymd = d.date;
      tb.appendChild(el('tr', {}, [
        el('td', {}, el('input', { type: 'checkbox', value: ymd })),
        el('td', {}, ymd.slice(0, 4) + '/' + ymd.slice(4, 6) + '/' + ymd.slice(6, 8)),
        el('td', { class: 'num' }, d.rows < 0 ? '開けません' : d.rows.toLocaleString() + ' 行'),
      ]));
    });
  }).catch(apiError);
}

async function downloadCsv() {
  var days = $$('#days input:checked').map(function (c) { return c.value; }).sort();
  if (!days.length) return toast('日付を選んでください。');
  var columns = $('input[name="cols"]:checked').value;
  var withEmail = $('#withEmail').checked;
  var parts = [], total = 0;
  $('#download').disabled = true;
  try {
    for (var i = 0; i < days.length; i++) {
      $('#logmsg').textContent = days[i] + ' を読み込んでいます…（' + (i + 1) + '/' + days.length + '）';
      var r = await API.logsCsv(T.session, days[i], columns, withEmail);
      if (!r.csv) continue;
      var lines = r.csv.split('\r\n');
      parts.push(parts.length ? lines.slice(1).join('\r\n') : r.csv);   // 見出しは最初の 1 回だけ
      total += r.rows;
    }
    if (!total) { $('#logmsg').textContent = '選んだ日にログがありません。'; return; }
    var name = 'monsakun_log_' + days[0] + (days.length > 1 ? '-' + days[days.length - 1] : '') + (columns === 'raw' ? '_raw32' : '') + '.csv';
    var blob = new Blob(['﻿' + parts.join('')], { type: 'text/csv;charset=utf-8' });
    var a = el('a', { href: URL.createObjectURL(blob), download: name });
    document.body.appendChild(a); a.click(); a.remove();
    $('#logmsg').textContent = '';
    toast(name + ' をダウンロードしました（' + total.toLocaleString() + ' 行）。');
  } catch (err) {
    $('#logmsg').textContent = '';
    apiError(err);
  } finally {
    $('#download').disabled = false;
  }
}

boot();
</script>
