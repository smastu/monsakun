<style>
/*
 * 実機（Android タブレット版）モンサクンの作問画面の再現。
 * 参照した画面写真:
 *   papers/11_論文ドラフト/stage1_基礎観測/06_戦略の違い/_執筆過程/extracted/img_senryaku/*.png
 *   papers/11_論文ドラフト/stage1_基礎観測/06_戦略の違い/_執筆過程/extracted/img_docx/image1.png
 *
 * 構成: 左に「レベル／もんだい」タブ → 作問条件の白枠 → 黒板（3 行の解答欄）→
 * チョーク受け → 操作ボタン →「もどる」の丸、右に選択肢カードの縦一列。

 */

.msk-stage {
  --paper: #fbf7dc;
  --side: #ded1a8;
  --board-frame: #c6a87a;
  --board: #5d7c5c;
  --card-border: #2e75ce;
  --tab-lv: #a9542a;
  --tab-asg: #e9b44c;
  --btn-off: #d9cfa8;
  --btn-on: #efc85e;
  --back: #c9a24b;

  position: relative;
  /* 実機はタブレットの固定解像度なので、設計幅を固定して表示幅に合わせて拡縮する
     （拡縮は app.js の fitStage が行う）。 */
  width: 1000px;
  transform-origin: top left;
  background: var(--paper);
  border: 1px solid #c9bd93;
  border-radius: 6px;
  padding: 26px 30px 34px;
  display: grid;
  grid-template-columns: 520px 1fr;
  gap: 26px;
  font-family: "Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", "Yu Gothic",
    "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}
/* 左右のうすい帯（実機の背景） */
.msk-stage::before, .msk-stage::after {
  content: ""; position: absolute; top: 0; bottom: 0; width: 22px;
  background: var(--side);
}
.msk-stage::before { left: 0; }
.msk-stage::after { right: 0; }

.msk-left, .msk-right { position: relative; z-index: 1; }
.msk-left { padding-bottom: 78px; }  /* 左下の「もどる」ボタンぶんの余白 */

/* --- レベル / もんだい タブ ------------------------------------------- */
.msk-tabs { display: flex; gap: 6px; margin-left: 4px; }
.msk-tab {
  border: 3px solid #000; border-bottom: none;
  padding: 3px 18px; font-size: 15px; font-weight: 700; letter-spacing: .04em;
}
.msk-tab.lv { background: var(--tab-lv); color: #fff; }
.msk-tab.asg { background: var(--tab-asg); color: #241a08; }

/* --- 作問条件 ---------------------------------------------------------- */
.msk-req {
  background: #fff; border: 4px solid #000; padding: 10px 14px 12px;
  font-size: 21px; line-height: 1.4; font-weight: 600; color: #111;
  white-space: pre-line;
  min-height: 108px;
}

/* --- 黒板 -------------------------------------------------------------- */
.msk-board {
  background: var(--board-frame); border-radius: 14px;
  padding: 10px 12px; margin-top: -2px;
}
.msk-board-inner {
  background: var(--board); border-radius: 10px; padding: 10px 12px 10px 8px;
  display: grid; gap: 8px;
}
.msk-row { display: grid; grid-template-columns: 62px 1fr; align-items: center; }
/* 行番号。丸は CSS の枠で描くので、中身は普通の数字にする（丸囲み数字 ①②③ を入れると丸が二重になる） */
.msk-num {
  width: 46px; height: 46px; margin: 0 auto; border: 3px solid #fff; border-radius: 50%;
  color: #fff; font-size: 26px; font-weight: 700; line-height: 40px; text-align: center;
  box-sizing: border-box; font-variant-numeric: tabular-nums;
}
.msk-slot {
  min-height: 62px; border-radius: 12px; background: #000;
  display: flex; align-items: center; justify-content: center;
  transition: box-shadow .12s;
}
.msk-slot.over { box-shadow: 0 0 0 4px #ffe680; }

/* チョーク受け */
.msk-tray {
  height: 12px; background: var(--board-frame); border-radius: 0 0 8px 8px;
  margin: 0 6px; position: relative;
}
.msk-tray i { position: absolute; top: 3px; height: 6px; border-radius: 2px; display: block; }
.msk-tray .eraser { left: 18px; width: 78px; background: #4c6b3f; }
.msk-tray .knob { left: 74px; width: 12px; top: 0; height: 9px; background: #8a8a8a; }
.msk-tray .chalk-w { left: 128px; width: 62px; background: #fff; }
.msk-tray .chalk-p { left: 200px; width: 56px; background: #c88ac0; }

/* --- 操作ボタン -------------------------------------------------------- */
.msk-action {
  display: block; width: 400px; margin: 20px 0 0 64px; padding: 12px 0;
  font-size: 24px; font-weight: 700; text-align: center; border-radius: 0;
  background: var(--btn-off); border: 2px solid #8a8a8a; color: #4a4a4a;
  cursor: default; font-family: inherit;
}
.msk-action.ready {
  background: var(--btn-on); border: 3px solid #000; color: #171717; cursor: pointer;
}
.msk-action.ready:hover { filter: brightness(1.06); }

/* 左下の「もどる」。押せる形に見えるよう、影つきの角丸ボタンにして矢印を添える。
   以前の大きな丸は作問画面の外にはみ出して 4 分の 1 が切れ、文字も端に寄っていた。 */
.msk-back {
  position: absolute; left: 4px; bottom: 6px;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 22px 9px 14px; border-radius: 999px;
  background: var(--back); border: 3px solid #000; box-shadow: 0 4px 0 #000;
  color: #171717; font-size: 20px; font-weight: 700; letter-spacing: .06em;
  cursor: pointer; z-index: 2; user-select: none;
  transition: transform .06s, box-shadow .06s, filter .12s;
}
.msk-back::before {
  content: ""; width: 0; height: 0;
  border-top: 9px solid transparent; border-bottom: 9px solid transparent;
  border-right: 13px solid #171717;
}
.msk-back:hover { filter: brightness(1.06); }
.msk-back:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; }

/* --- 選択肢カード ------------------------------------------------------ */
.msk-fit { position: relative; overflow: hidden; }

.msk-tray-list { display: grid; gap: 10px; padding-top: 122px; }
.msk-pos { min-height: 62px; border-radius: 12px; }
.msk-pos.over { box-shadow: 0 0 0 4px #ffe680; }

.msk-card {
  background: #fff; border: 3px solid var(--card-border); border-radius: 12px;
  min-height: 62px; padding: 8px 12px; font-size: 15px; line-height: 1.4;
  white-space: pre-line;
  color: #1a1a1a; text-align: center;
  display: flex; align-items: center; justify-content: center;

.msk-card:active { cursor: grabbing; }
.msk-card.dragging { opacity: .28; }
.msk-slot .msk-card { width: 100%; }

/* ドラッグ中に指（カーソル）についてくる複製。
   body 直下に置くので .msk-stage の色の変数は届かない（var() を使うと枠の指定ごと無効になり枠が消える）。
   色は直接書く。傾けない（取り残されたときに「カードが斜めになった」ように見えるため）。 */
.msk-ghost {

<style>
/* GAS 版で足した画面（ログイン・レベル選択・終了・送信状態）。作問画面そのものは MonsakunStyle.html。 */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: #ded1a8; color: #1a1a1a;
  font-family: "Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", "Yu Gothic", Meiryo, sans-serif;
  overflow: hidden;
}
[hidden] { display: none !important; }
/* 画面より中身が高いとき（スマホの横など）はスクロールさせる。safe center で上が切れないようにする */
.screen { width: 100%; height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.screen.center { display: flex; align-items: safe center; justify-content: center; padding: 16px; }
/* align-items: flex-start … 既定の stretch だと、作問画面の外枠が画面の高さに固定され、
   はみ出した部分が切り取られてスクロールもできなくなる（スマホ横で「こたえあわせ」が押せなかった） */
#play { display: flex; justify-content: center; align-items: flex-start; padding: 8px; }
#play .msk-fit { width: 100%; max-width: 1600px; }

.home-box {
  background: #fbf7dc; border: 4px solid #000; border-radius: 6px;
  padding: 28px 36px; text-align: center; max-width: 560px; width: 100%;
}
.home-box h1 { margin: 0 0 4px; font-size: 40px; letter-spacing: .08em; }
.big { font-size: 30px; font-weight: 700; margin: 8px 0; }
.small { font-size: 15px; color: #444; margin: 6px 0 0; }

.levels { display: grid; gap: 14px; margin: 24px 0 18px; }
.levels button {
  font: inherit; font-size: 26px; font-weight: 700; padding: 14px 10px;
  background: #efc85e; border: 3px solid #000; cursor: pointer;
  display: flex; justify-content: space-between; align-items: center;
}
.levels button:hover { filter: brightness(1.06); }
.levels button small { font-size: 15px; font-weight: 600; }
.levels button.done { background: #f6e3a6; }

.logout {
  font: inherit; font-size: 18px; padding: 8px 26px; background: #fff;
  border: 2px solid #555; cursor: pointer; margin-top: 4px;
}
.gbtn { display: flex; justify-content: center; margin: 24px 0 8px; min-height: 44px; }
.loginmsg { min-height: 1.5em; color: #8a3b12; }
.who { font-size: 12px; color: #6b6b6b; margin: 16px 0 0; word-break: break-all; }

/* タッチ操作：画面は縦スクロールだけ許し、カードの上ではスクロールもズームも止める。
   touch-action は指を置いた要素で決まるので、カードから始めたドラッグは途中でスクロールに奪われない
   （奪われると pointercancel になり、ドラッグが打ち切られる）。 */
#play, #play .msk-stage { touch-action: pan-y; }
#play .msk-card { touch-action: none; }

/* --- スマホ用の配置（App.html の fitStage が .fluid を付ける） ------------------------------
   実機の画面を縮めずに縦に並べ替える：レベル／もんだい → 作問条件 → 黒板 → こたえあわせ → カード。
   「もどる」は右上に置く。文字の大きさは縮めない（カード 15px、作問条件 17px）。 */
.msk-stage.fluid {
  width: 100%; max-width: 640px; margin: 0 auto; padding: 12px 12px 16px;
  grid-template-columns: 1fr; gap: 12px; border-radius: 6px;
}
.msk-stage.fluid::before, .msk-stage.fluid::after { display: none; }
.msk-stage.fluid .msk-left { padding-bottom: 0; }
/* タブの行：左にレベル／もんだい、右端に「もどる」。タブは下端をそろえて作問条件の枠に接したままにする */
.msk-stage.fluid .msk-tabs { align-items: flex-end; margin-left: 0; }
.msk-stage.fluid .msk-tab { font-size: 14px; padding: 3px 10px; white-space: nowrap; }
.msk-stage.fluid .msk-req { font-size: 17px; min-height: 0; padding: 8px 12px 10px; border-width: 3px; }
.msk-stage.fluid .msk-board { padding: 8px; border-radius: 12px; }
.msk-stage.fluid .msk-board-inner { padding: 8px 8px 8px 4px; gap: 6px; }
.msk-stage.fluid .msk-row { grid-template-columns: 44px 1fr; }
.msk-stage.fluid .msk-num { width: 36px; height: 36px; font-size: 20px; line-height: 30px; border-width: 3px; }
.msk-stage.fluid .msk-slot, .msk-stage.fluid .msk-pos, .msk-stage.fluid .msk-card { min-height: 54px; }
.msk-stage.fluid .msk-card { font-size: 15px; padding: 6px 10px; }
.msk-stage.fluid .msk-action { width: 100%; margin: 12px 0 0; font-size: 21px; padding: 10px 0; }
.msk-stage.fluid .msk-hint { width: 100%; margin: 12px 0 0; }
.msk-stage.fluid .msk-tray-list { padding-top: 0; gap: 8px; }
.msk-stage.fluid .msk-back {
  position: static; margin: 0 0 8px auto; flex: none;
  font-size: 16px; padding: 6px 16px 6px 12px; box-shadow: 0 3px 0 #000;
}
.msk-stage.fluid .msk-back::before { border-top-width: 7px; border-bottom-width: 7px; border-right-width: 10px; }
/* 結果の表示は画面（スクロール位置）の真ん中に出す。作問画面の真ん中だと画面外になることがある */
.msk-stage.fluid .msk-verdict { position: fixed; }
.msk-stage.fluid .msk-verdict > div { font-size: 30px; padding: 18px 28px; }
.msk-stage.fluid .msk-verdict .mark { font-size: 48px; }

/* タブレット縦など幅に余裕がある縦長の画面：文字とカードを大きくする */
@media (min-width: 700px) and (min-height: 520px) {
  .msk-stage.fluid { max-width: 760px; padding: 18px 20px 24px; }
  .msk-stage.fluid .msk-tab { font-size: 16px; padding: 4px 16px; }
  .msk-stage.fluid .msk-req { font-size: 22px; padding: 10px 14px 12px; }
  .msk-stage.fluid .msk-row { grid-template-columns: 56px 1fr; }
  .msk-stage.fluid .msk-num { width: 44px; height: 44px; font-size: 24px; line-height: 38px; }
  .msk-stage.fluid .msk-slot, .msk-stage.fluid .msk-pos, .msk-stage.fluid .msk-card { min-height: 64px; }
  .msk-stage.fluid .msk-card { font-size: 18px; }
  .msk-stage.fluid .msk-action { font-size: 24px; padding: 12px 0; }
  .msk-stage.fluid .msk-back { font-size: 18px; padding: 8px 20px 8px 14px; }
}

/* スマホの横（低くて広い）：黒板と選択肢を左右 2 列にする */
@media (min-width: 600px) and (max-height: 519px) {
  .msk-stage.fluid { max-width: 980px; grid-template-columns: 1.1fr 1fr; }
  .msk-stage.fluid .msk-tray-list { padding-top: 34px; }
}

/* 狭い画面ではレベル選択などの枠を詰める */
@media (max-width: 480px) {
  .home-box { padding: 20px 16px; }
  .home-box h1 { font-size: 32px; }
  .levels button { font-size: 22px; }
}

/* ドラッグ中のゴーストは body 直下に置くので、.msk-stage で定義した色の変数が届かない
   （そのままだと青い枠が消える）。色をここで直接指定し、傾けない。 */
.msk-ghost { border: 3px solid #2e75ce; transform: none; color: #1a1a1a; box-sizing: border-box; }

/* 正解のあとの「つぎへ」 */
.msk-verdict button {
  display: block; margin: 16px auto 0; font: inherit; font-size: 24px; font-weight: 700;
  padding: 10px 28px; background: #efc85e; border: 3px solid #000; cursor: pointer;
}

/* 送信状態（教員の確認用。児童の操作は邪魔しない位置に小さく出す） */
.sendstate {
  position: fixed; right: 6px; bottom: 4px; font-size: 11px; color: #555;
  background: rgba(255,255,255,.75); padding: 1px 6px; border-radius: 3px; z-index: 1000;
}
.sendstate.fail { color: #b3261e; font-weight: 700; }
</style>

<script>
/*
 * GAS（ログ受信用ウェブアプリ）との通信。
 *
 * Content-Type を text/plain にして「単純なリクエスト」にする。application/json にすると
 * ブラウザが事前確認（OPTIONS）を送り、GAS はそれに答えられないので失敗する。
 * GAS の応答は script.googleusercontent.com への転送を経て返り、こちらはそれをそのまま読む。
 */
var API = (function () {
  function post(body) {
    return fetch(MSK_CONFIG.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body),
    }).then(function (r) {
      if (!r.ok) throw new Error('通信エラー（HTTP ' + r.status + '）');
      return r.json();
    }).then(function (j) {
      if (!j.ok) {
        var err = new Error(j.error || 'エラー');
        err.code = j.code;
        throw err;
      }
      return j;
    });
  }
  return {
    login: function (idToken) { return post({ action: 'login', idToken: idToken }); },
    resume: function (session) { return post({ action: 'resume', session: session }); },
    log: function (session, events) { return post({ action: 'log', session: session, events: events }); },
  };
})();

  compare: 'ちがいは（比較）',

const STORY_FORM = { combine: '+', increase: '+', decrease: '-', compare: '-' };

const FLAGS = ['SS.S', 'ST.S', 'O.S', 'N.S', 'C.S'];

const DEFAULT_OPTS = {
  // N.S の規則。'hybrid' が実ログと最もよく一致する（Lv1 のみ緩い）。
  //   'strict'  … 作問条件で指定された数値をそのまま使っているか

  //   'hybrid'  … Lv1 は lenient、Lv2・Lv3 は strict

// 補助
// ---------------------------------------------------------------------------

/** カードが言及するオブジェクトの一覧 */
function cardObjects(c) {

  if (c.rel === 'combine') return c.objs.slice();
  if (c.rel === 'compare') return [c.subj, c.ref];
  return [c.obj]; // increase / decrease

function sameMultiset(a, b) {
  if (a.length !== b.length) return false;
  const x = a.slice().sort();
  const y = b.slice().sort();
  return x.every((v, i) => v === y[i]);

/**
 * 置かれた 3 枚から物語の数量関係を復元する。
 * 返り値 { form, x, y, z, rel } は「x form y = z」を意味する。
 *   合併 : 部分 + 部分 = 全体
 *   増加 : 変化前 + 増加量 = 変化後
 *   減少 : 変化前 - 減少量 = 変化後
 *   比較 : 多い方 - 少ない方 = 差
 * 増加・減少では、存在文のうちスロット順で先にある方を「変化前」とみなす。
 * 復元できない場合は null。
 */
function storyEquation(cards, slots) {
  const placed = slots.map((id) => (id ? cards[id - 1] : null));
  if (placed.some((c) => !c)) return null;
  const rels = placed.filter((c) => c.kind === 'rel');
  const eOrder = placed.filter((c) => c.kind === 'exist');
  if (rels.length !== 1 || eOrder.length !== 2) return null;
  const rel = rels[0];

  }

             roles: { before: eOrder[0], change: rel, after: eOrder[1] } };
  }

    return { form: '-', x: eOrder[0].num, y: rel.num, z: eOrder[1].num, rel: 'decrease',

    if (!big || !small || big === small) return null; // 参照先の存在文が置かれていない
    return { form: '-', x: big.num, y: small.num, z: rel.num, rel: 'compare',
             roles: { larger: big, smaller: small, diff: rel } };
  }

}

/**
 * 3 つの数量からなる加法的関係の正準形。
 *
 * 「x + y = z」も「x - y = z」も、結局は「全体 = 部分 + 部分」という 1 つの関係である。
 * 差の書き方は一意ではない（8-2=6 と 8-6=2 は同じ関係）ので、
 *   加算形 x + y = z → { whole: z, parts: [x, y] }
 *   減算形 x - y = z → { whole: x, parts: [y, z] }
 * に畳んでから比較する。これにより「2+7=?」と「2+?=7」は別物として区別しつつ、
 * 「?-6=2」と「?-2=6」は同じ関係として同一視できる。

    : { whole: x, parts: [y, z].sort() };

function sameRelation(r1, r2) {

  return r1.whole === r2.whole && sameMultiset(r1.parts, r2.parts);
}

/** 作問条件を正準形にする */

    const all = placed.map((c) => c.obj);
    if (all.every((x) => x === all[0])) flags['O.S'] = 1;

      : `使った数は {${used.join(', ')}}。作問条件が求めているのは {${need.join(', ')}}`;

  // 3 条件の連言:
  //   (1) お話の種類が導く演算（たし算／ひき算）が課題のそれと一致する
  //   (2) 文順序制約のある課題（増加・減少）では関係文が中央のスロットにある
  //   (3) お話が表す数量関係（正準形）が作問条件のそれと一致する

      + `のお話を求めているが、作ったお話は${eq.form === '+' ? 'たし算' : 'ひき算'}になっている`;
  } else if (!posOk) {
    reasons['C.S'] = '「変化前 → 変化 → 変化後」の順に並べる必要がある（関係文はまん中）';
  } else {
    const got = canonical(eq.form, eq.x, eq.y, eq.z);
    const want = requirementRelation(req);
    if (sameRelation(got, want)) {
      flags['C.S'] = 1;
    } else {

        ? `「${req.a} ${req.op} ${req.b} = ${req.r}」`
        : `「${req.a} ${req.op} ${req.b}」で求められる関係`;
      reasons['C.S'] = `作ったお話が表す式は「${eq.x} ${eq.form} ${eq.y} = ${eq.z}」`
        + `（全体 ${got.whole}、部分 ${got.parts.join(' と ')}）。作問条件は ${shown}`;
    }
  }

  const allSatisfied = FLAGS.every((f) => flags[f] === 1);
  return { complete: true, flags, allSatisfied, reasons, equation: eq };
}

module.exports = {
  evaluate, FLAGS, STORY_LABEL, STORY_FORM, storyEquation, cardObjects,
  canonical, requirementRelation, requiredNumbers, DEFAULT_OPTS,
};

  return module.exports;
})();
</script>

<script>
/*
 * ログ 1 行の盤面由来の列を作る純粋関数（ブラウザと tools/test_gas.js の両方で使う）。
 *
 * 列の意味は寺西小 2020 実践の生ログ（data/00_元データ/README.md）に合わせる。
 *   ans        … slot3×100 + slot2×10 + slot1 の数値（例: ①3 ②1 ③2 → 213）
 *                REMOVE 行だけは「取り除く前」の盤面で作る（生ログ 304,801 行で確認）
 *   ans_order  … slot1 slot2 slot3 を並べた 3 桁の文字列（例: "312"）
 *   ans_sort   … 3 つの番号を昇順に並べた 3 桁の文字列（例: "123"、空きは 0 で "003"）
 *   jdg        … 盤面が 5 制約をすべて満たせば "s"、それ以外は "f"（"t" は使わない）
 *   C.S〜O.S   … 3 枚そろった盤面だけ 0/1 を入れ、そろっていなければ空欄
 *   validity   … 5 フラグの合計（3 枚そろったときだけ）
 * ans・jdg・5 フラグ・validity は judgeSlots（REMOVE では取り除く前の盤面）から、
 * slot1〜3・ans_sort・ans_order は slots（操作後の盤面）から作る。生ログがそうなっているため
 * （REMOVE 行の jdg は「取り除く前」の盤面で読むと 83,312 行すべてで一致する）。
 */
var MSK_LOG = (function () {
  function ansNumber(slots) { return slots[2] * 100 + slots[1] * 10 + slots[0]; }
  function ansOrder(slots) { return slots.join(''); }
  function ansSort(slots) { return slots.slice().sort(function (a, b) { return a - b; }).join(''); }

  /** 盤面から決まる列。task が無い（ログイン行など）ときは空の盤面として扱う。 */
  function boardFields(task, slots, judgeSlots) {
    var s = (slots || [0, 0, 0]).map(Number);
    var j = (judgeSlots || s).map(Number);
    var out = {
      ans: ansNumber(j), ans_sort: ansSort(s), ans_order: ansOrder(s),
      slot1: s[0], slot2: s[1], slot3: s[2],
      jdg: 'f', 'C.S': '', 'ST.S': '', 'N.S': '', 'SS.S': '', 'O.S': '', validity: '',
      reason: '',
    };
    if (!task || !j.every(function (x) { return x > 0; })) return out;
    var r = MSK.evaluate(task, j);
    var sum = 0;
    MSK.FLAGS.forEach(function (f) { out[f] = r.flags[f]; sum += r.flags[f]; });
    out.validity = sum;
    out.jdg = r.allSatisfied ? 's' : 'f';
    out.reason = MSK.FLAGS.filter(function (f) { return r.reasons[f]; })
      .map(function (f) { return f + ': ' + r.reasons[f]; }).join(' / ');
    return out;
  }

  return { ansNumber: ansNumber, ansOrder: ansOrder, ansSort: ansSort, boardFields: boardFields };
})();
</script>

<script>
'use strict';
/*
 * モンサクン（GAS 版）の画面とログ記録。
 *
 * 作問画面とドラッグ操作は demo_bn_support/public/app.js から流用した。違いは次の 4 点。
 *   - 支援パネル（到達確率・BN・知識モデル）は無い。判定（こたえあわせ）だけをブラウザで行う。
 *   - レベル選択 → 課題を番号順に出題 → レベルクリア、という実践の流れにした。
 *   - 操作のたびに、寺西小 2020 の生ログと同じ列のイベントを作り、まとめてサーバへ送る。
 *   - 最初に各自の Google アカウントでログインする（Google Identity Services）。
 *     受け取った ID トークンを GAS が Google に照会してメールを確定し、セッション券を返す。
 *     セッション券は端末に保存し、再読み込みではログインを省く。「おわる」で消す。
 *
 * 1 回の画面操作が複数のイベントになる場合（demo の手数の数え方と同じ）:
 *   選択肢 → 黒板の空き行       … SET
 *   黒板 → 選択肢              … REMOVE
 *   黒板 → 黒板の空き行         … REMOVE（元の行）→ SET（先の行）
 *   黒板の 2 枚を入れ替え        … REMOVE（元）→ REMOVE（先）→ SET（先）→ SET（元）
 *   選択肢 → 埋まった行         … REMOVE（押し出す 1 枚）→ SET（置く 1 枚）
 */

var $ = function (sel, root) { return (root || document).querySelector(sel); };
var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
function el(tag, attrs, kids) {
  var n = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function (k) {
    if (k === 'class') n.className = attrs[k];
    else if (k.indexOf('on') === 0) n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  });
  [].concat(kids || []).forEach(function (c) {
    if (c === null || c === undefined) return;
    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return n;
}
function unixSec() { return Math.floor(Date.now() / 1000); }

var APP = {
  info: null,
  pageSession: Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8),
  seq: 0, queue: [], sending: false, fail: 0,
  loginSession: 0,
  lv: 0, list: [], idx: 0,
  task: null, slots: [0, 0, 0], tray: [], home: {}, stp: 0, checks: 0,
  probSession: 0, initPos: '0', trial: 1, solved: false,
};

// ---------------------------------------------------------------------------
// 端末に残す情報（未送信のログ・クリア済みの課題・試行回数）。読めなくても動くようにする。
// ---------------------------------------------------------------------------
function storeKey(name) { return 'monsakun:' + (APP.info ? APP.info.userId : 'anon') + ':' + name; }
function load(name, fallback) {
  try { var s = localStorage.getItem(storeKey(name)); return s ? JSON.parse(s) : fallback; }
  catch (e) { return fallback; }
}
function save(name, value) {
  try { localStorage.setItem(storeKey(name), JSON.stringify(value)); } catch (e) { /* 保存できなくても続ける */ }
}

// ---------------------------------------------------------------------------
// 起動
// ---------------------------------------------------------------------------
var SESSION_KEY = 'monsakun:session';

function boot() {
  var saved = null;
  try { saved = localStorage.getItem(SESSION_KEY); } catch (e) { /* 読めなければログインから */ }
  if (!saved) return showLogin();
  API.resume(saved).then(onBootstrap).catch(function (err) {
    if (err.code === 'auth') { forgetSession(); return showLogin(); }
    showError(err.message);
  });
}

function forgetSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch (e) { /* 無視 */ }
}

/** Google のログインボタンを出す。ライブラリの読み込みを待ってから描く。 */
function showLogin(msg) {
  show('login');
  $('#loginmsg').textContent = msg || '';
  if (MSK_CONFIG.mockLogin) {          // tools/preview.js のプレビュー用
    $('#gbtn').innerHTML = '';
    $('#gbtn').appendChild(el('button', { class: 'logout', onclick: function () { onCredential({ credential: 'preview' }); } },
      '（プレビュー）ログイン'));
    return;
  }
  var tries = 0;
  (function draw() {
    if (!(window.google && google.accounts && google.accounts.id)) {
      if (++tries > 100) { $('#loginmsg').textContent = 'Google のログイン部品を読み込めませんでした。通信を確かめて、開き直してください。'; return; }
      return setTimeout(draw, 100);
    }
    google.accounts.id.initialize({ client_id: MSK_CONFIG.clientId, callback: onCredential, auto_select: false });
    $('#gbtn').innerHTML = '';
    google.accounts.id.renderButton($('#gbtn'), { theme: 'outline', size: 'large', text: 'signin_with', locale: 'ja' });
  })();
}

function onCredential(resp) {
  $('#loginmsg').textContent = 'ログインしています…';
  API.login(resp.credential).then(function (info) {
    try { localStorage.setItem(SESSION_KEY, info.session); } catch (e) { /* 保存できなくても今回は使える */ }
    onBootstrap(info);
  }).catch(function (err) {
    $('#loginmsg').textContent = err.message;
  });
}

function onBootstrap(info) {
  var sameUser = APP.info && APP.info.userId === info.userId;
  APP.info = info;
  $('#who').textContent = info.email + (info.registered ? '' : '（名簿に未登録）');
  if (!APP.wired) {                     // ログインし直したときに二重に登録しない
    APP.wired = true;
    $('#action').addEventListener('click', doCheck);
    $('#back').addEventListener('click', quitLevel);
    $('#logout').addEventListener('click', logout);
    $('#again').addEventListener('click', function () { location.reload(); });
    window.addEventListener('resize', fitStage);
    window.addEventListener('pagehide', function () { if (APP.info) save('queue', APP.queue); flush(); });
    setInterval(flush, info.flushMs);
  }
  if (sameUser && APP.resumeTo) {       // 有効期限切れからのログインし直し：もとの画面へ戻る
    var back = APP.resumeTo;
    APP.resumeTo = null;
    show(back);
    flush();
    return;
  }
  APP.queue = load('queue', []);       // 前回送れなかったログがあれば先に送る
  APP.loginSession = unixSec();
  emit('LOGIN', { lv: 0, asg: 1, session: APP.loginSession, noTask: true, flush: true });
  showHome();
}

/** セッション券が切れた・無効になった。ログは端末に残したまま、ログインし直してもらう。 */
function needLogin(msg) {
  forgetSession();
  if (!APP.resumeTo) APP.resumeTo = ['home', 'play', 'bye'].find(function (id) { return !$('#' + id).hidden; }) || 'home';
  showLogin(msg || 'もういちど ログインしてね');
}

function show(id) {
  ['loading', 'login', 'error', 'home', 'play', 'bye'].forEach(function (s) { $('#' + s).hidden = s !== id; });
  if (id === 'play') fitStage();
}

function showError(msg) {
  $('#errormsg').textContent = msg;
  show('error');
}

// ---------------------------------------------------------------------------
// レベル選択
// ---------------------------------------------------------------------------
function tasksOfLevel(lv) {
  return MSK_TASKS.tasks.filter(function (t) { return t.lv === lv; })
    .sort(function (a, b) { return a.asg - b.asg; });
}

function showHome() {
  var cleared = load('cleared', {});
  var box = $('#levels');
  box.innerHTML = '';
  APP.info.levels.forEach(function (lv) {
    var list = tasksOfLevel(lv);
    var n = list.filter(function (t) { return cleared[t.lvAsg]; }).length;
    box.appendChild(el('button', {
      class: n === list.length ? 'done' : '',
      onclick: function () { startLevel(lv); },
    }, ['レベル ' + lv, el('small', {}, n + ' / ' + list.length + ' もん')]));
  });
  APP.task = null;
  show('home');
}

function startLevel(lv) {
  var cleared = load('cleared', {});
  APP.lv = lv;
  APP.list = tasksOfLevel(lv);
  // まだ正解していない最初の課題から始める（全部正解済みなら 1 番から）
  var first = APP.list.findIndex(function (t) { return !cleared[t.lvAsg]; });
  APP.idx = first < 0 ? 0 : first;
  emit('LEVEL_BEGIN', { lv: lv, asg: APP.list[APP.idx].asg, session: APP.loginSession, noTask: true });
  startProblem();
}

function startProblem() {
  var t = APP.list[APP.idx];
  APP.task = t;
  APP.slots = [0, 0, 0];
  APP.stp = 0;
  APP.checks = 0;
  APP.solved = false;
  // 実機は課題開始時にカードの並びをシャッフルする（生ログの InitPosition 列に対応）
  var ids = t.cards.map(function (c) { return c.id; });
  for (var i = ids.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = ids[i]; ids[i] = ids[j]; ids[j] = tmp;
  }
  APP.tray = ids;
  APP.home = {};
  ids.forEach(function (id, k) { APP.home[id] = k; });
  APP.initPos = ids.join('');
  APP.probSession = unixSec();
  var trials = load('trial', {});
  trials[t.lvAsg] = (trials[t.lvAsg] || 0) + 1;
  save('trial', trials);
  APP.trial = trials[t.lvAsg];
  $('#learnermsg').hidden = true;
  emit('PROB_BEGIN');
  show('play');
  render();
}

/** 「もどる」：課題の途中でレベルをやめる。実機と同じく、その課題の番号で LEVEL_END を記録する。 */
function quitLevel() {
  if (!APP.task) return;
  emit('LEVEL_END', { session: unixSec(), slots: [0, 0, 0], stp: 0, check: 0, trial: 'NA', board: false, flush: true });
  showHome();
}

function logout() {
  emit('LOGOUT', { lv: 0, asg: 1, session: APP.loginSession, noTask: true, flush: true });
  $('#byemsg').textContent = 'きろくを おくっています…';
  show('bye');
  // 送り終わってから（最大 15 秒待って）セッション券を消す。共用の端末で次の人が前の人として記録されないように。
  var waited = 0;
  (function wait() {
    if (APP.queue.length && waited < 15000) { waited += 300; return setTimeout(wait, 300); }
    forgetSession();
    $('#byemsg').textContent = APP.queue.length
      ? 'まだ おくれていない きろくが あります。つぎに ログインしたときに おくります。'
      : 'このまま とじて だいじょうぶです。';
  })();
}

// ---------------------------------------------------------------------------
// ログ
// ---------------------------------------------------------------------------
/**
 * イベントを 1 件作って送信待ちに積む。列名は寺西小 2020 の生ログと同じ。
 * Number・Class・Grade・user_id・email はサーバが名簿とログイン情報から入れる（ここでは送らない）。
 */
function emit(ope1, o) {
  o = o || {};
  var t = o.noTask ? null : APP.task;
  var slots = o.slots || (t ? APP.slots.slice() : [0, 0, 0]);
  var lv = o.lv !== undefined ? o.lv : t.lv;
  var asg = o.asg !== undefined ? o.asg : t.asg;
  var ev = MSK_LOG.boardFields(o.board === false ? null : t, slots, o.judgeSlots);
  var cardObj = t && o.card ? t.cards.find(function (c) { return c.id === o.card; }) : null;
  APP.seq += 1;
  ev.event_id = APP.pageSession + '-' + APP.seq;
  ev.page_session = APP.pageSession;
  ev.seq = APP.seq;
  ev.client_ts = Date.now();
  ev.app_version = APP.info.appVersion;
  ev.ope1 = ope1;
  ev.lv = lv;
  ev.asg = asg;
  ev.lvAsg = lv * 100 + asg;
  ev.InitPosition = o.initPos !== undefined ? o.initPos : (t ? APP.initPos : '0');
  ev.stp = o.stp !== undefined ? o.stp : (t ? APP.stp : 0);
  ev.slot = o.slot || 0;
  ev.card = o.card || 0;
  ev.session = o.session !== undefined ? o.session : APP.probSession;
  ev.check = o.check !== undefined ? o.check : (t ? APP.checks : 0);
  ev.trial = o.trial !== undefined ? o.trial : (t ? APP.trial : 'NA');
  ev.card_text = cardObj ? cardObj.text : '';
  if (ope1 !== 'CHECK') ev.reason = '';   // 不充足の理由は答え合わせの行にだけ残す
  if (ope1 === 'PROB_END') {
    // 実機の PROB_END 行のフラグ列には意味の確定しない集計値が入っているので、再現せず空欄にする
    MSK.FLAGS.concat(['validity']).forEach(function (k) { ev[k] = ''; });
  }
  APP.queue.push(ev);
  save('queue', APP.queue);
  if (o.flush || APP.queue.length >= APP.info.maxBatch) flush();
  updateSendState();
}

function flush() {
  if (APP.sending || !APP.queue.length || !APP.info || !$('#login').hidden) return;
  APP.sending = true;
  var batch = APP.queue.slice(0, APP.info.maxBatch);
  var session = APP.info.session;
  API.log(session, batch).then(function () {
    APP.queue.splice(0, batch.length);
    save('queue', APP.queue);
    APP.sending = false;
    APP.fail = 0;
    updateSendState();
    if (APP.queue.length) flush();
  }).catch(function (err) {
    APP.sending = false;
    if (err.code === 'auth') {
      // セッション券が切れた：送り直しても通らないので、ログインし直してもらう（ログは端末に残る）
      updateSendState(err);
      return needLogin(err.message);
    }
    // 失敗したら待ち時間を倍にして送り直す（最大 1 分）。ログは端末に残っているので失われない。
    APP.fail += 1;
    updateSendState(err);
    setTimeout(flush, Math.min(60000, 2000 * Math.pow(2, APP.fail)));
  });
}

function updateSendState(err) {
  var s = $('#sendstate');
  var n = APP.queue.length;
  s.hidden = n === 0 && !APP.fail;
  s.className = 'sendstate' + (APP.fail ? ' fail' : '');
  s.textContent = APP.fail
    ? '送信できていません（' + n + ' 件を保存中）' + (err && err.message ? '：' + err.message : '')
    : '送信待ち ' + n + ' 件';
}

// ---------------------------------------------------------------------------
// 盤面の操作（1 枚ごとに SET / REMOVE を記録）
// ---------------------------------------------------------------------------
function removeFromSlot(i) {
  var before = APP.slots.slice();   // 生ログの REMOVE 行は ans・jdg・フラグを取り除く前の盤面で持つ
  var card = APP.slots[i];
  APP.slots[i] = 0;
  APP.tray[APP.home[card]] = card;
  APP.stp += 1;
  emit('REMOVE', { slot: i + 1, card: card, judgeSlots: before });
}

function setToSlot(i, card) {
  APP.tray[APP.home[card]] = 0;
  APP.slots[i] = card;
  APP.stp += 1;
  emit('SET', { slot: i + 1, card: card });
}

/** 盤面が変わったら前の答え合わせの吹き出しを消す（今の盤面への指摘だと誤解させないため） */
function clearHint() {
  var hint = $('#learnermsg');
  if (!hint.hidden) hint.hidden = true;
}

function placeInSlot(id, from, slot) {
  if (APP.solved) return;
  if (from.kind === 'slot' && from.index === slot) return;
  clearHint();
  var occupant = APP.slots[slot];
  if (from.kind === 'slot') {
    removeFromSlot(from.index);
    if (occupant) removeFromSlot(slot);
    setToSlot(slot, id);
    if (occupant) setToSlot(from.index, occupant);
  } else {
    if (occupant) removeFromSlot(slot);
    setToSlot(slot, id);
  }
  render();
}

function returnToTray(id, from) {
  if (APP.solved || from.kind !== 'slot') return;
  clearHint();
  removeFromSlot(from.index);
  render();
}

// ---------------------------------------------------------------------------
// 答え合わせ
// ---------------------------------------------------------------------------
function doCheck() {
  if (APP.solved || !APP.slots.every(function (s) { return s > 0; })) return;
  var r = MSK.evaluate(APP.task, APP.slots);
  APP.checks += 1;
  emit('CHECK', { flush: true });
  var hint = $('#learnermsg');
  if (r.allSatisfied) {
    APP.solved = true;
    hint.hidden = true;
    fitStage();
    var cleared = load('cleared', {});
    cleared[APP.task.lvAsg] = true;
    save('cleared', cleared);
    var last = APP.idx === APP.list.length - 1;
    showVerdict(true, last ? 'レベル ' + APP.lv + ' クリア！' : 'つぎの もんだいへ', nextProblem);
  } else {
    showVerdict(false);
    if (APP.info.feedback === 'reasons') {
      hint.hidden = false;
      hint.className = 'msk-hint';
      hint.textContent = MSK.FLAGS.filter(function (f) { return r.reasons[f]; })
        .map(function (f) { return r.reasons[f]; })[0] || '';
      fitStage();   // 吹き出しの分だけ画面が高くなるので、拡縮をやり直す（しないと下が切れる）
    }
  }
}

function nextProblem() {
  emit('PROB_END', { flush: true });
  var lastAsg = APP.list[APP.list.length - 1].asg;
  APP.idx += 1;
  if (APP.idx < APP.list.length) return startProblem();
  // レベルを最後まで解いた。実機は「最終課題番号＋1」の番号で LEVEL_END → LEVEL_CLEAR を記録する。
  var o = { asg: lastAsg + 1, session: unixSec(), slots: [0, 0, 0], stp: 0, check: 0, trial: 'NA', board: false };
  emit('LEVEL_END', o);
  emit('LEVEL_CLEAR', Object.assign({ flush: true }, o));
  showHome();
}

function showVerdict(correct, nextLabel, onNext) {
  var old = $('.msk-verdict');
  if (old) old.remove();
  var inner = el('div', {}, [
    el('span', { class: 'mark' }, correct ? '〇' : '✗'),
    correct ? 'せいかい！' : 'ざんねん…',
  ]);
  var v = el('div', { class: 'msk-verdict ' + (correct ? 'ok' : 'ng') }, [inner]);
  if (correct) {
    inner.appendChild(el('button', { onclick: function () { v.remove(); onNext(); } }, nextLabel));
  } else {
    setTimeout(function () { v.remove(); }, 1500);
  }
  $('#stage').appendChild(v);
}

// ---------------------------------------------------------------------------
// 描画と拡縮（demo_bn_support/public/app.js と同じ）
// ---------------------------------------------------------------------------
var DESIGN_W = 1000;
var stageScale = 1;

// 縮めずに並べ替える配置（fluid）に切り替える条件：縦長の画面（スマホ縦・タブレット縦）、
// 幅 < 760（狭い画面）、高さ < 520（スマホ横）。実機と同じ横長の配置を拡縮するのは、横長で十分な大きさの画面だけ。
// Why：タブレット縦（768×1024）で横長の配置を拡縮すると 0.75 倍になり、カードの文字が 11.3px になった。
var FLUID_MAX_W = 760, FLUID_MAX_H = 520;

function fitStage() {
  var fit = $('#fit'), stage = $('#stage');
  if (!fit || !stage || $('#play').hidden) return;
  var vw = window.innerWidth, vh = window.innerHeight;
  var fluid = vw < FLUID_MAX_W || vh < FLUID_MAX_H || vh > vw;
  document.body.classList.toggle('fluid', fluid);
  stage.classList.toggle('fluid', fluid);
  // 「もどる」の置き場所：スマホ用の配置ではタブと同じ行の右端（作問条件の白枠に重ならないように）、
  // 拡縮する配置では実機と同じく左下。
  var back = $('#back'), tabs = $('.msk-tabs'), left = $('.msk-left');
  if (fluid && back.parentNode !== tabs) tabs.appendChild(back);
  if (!fluid && back.parentNode !== left) left.appendChild(back);
  if (fluid) {
    // スマホ：実機の画面を丸ごと縮めると文字が 5px ほどになって読めないので、縮めずに縦に並べ替える。
    // はみ出す分は縦にスクロールする（カードに触れたときはスクロールせずドラッグになる）。
    stageScale = 1;
    stage.style.transform = 'none';
    fit.style.height = 'auto';
    fit.style.width = '100%';
    return;
  }
  // タブレット・PC：実機は固定解像度のタブレット画面なので、設計幅 1000px でレイアウトして画面に合わせて拡縮する。
  // 幅と高さの両方に収まる倍率にし、スクロールしなくても全体が見えるようにする。
  // 倍率は外枠（#play）の幅から求める。#fit は下で幅を固定するので、それを基準にすると縮められなくなる。
  var availW = Math.min($('#play').clientWidth - 16, 1600);
  stageScale = Math.min(1.6, availW / DESIGN_W, (vh - 16) / stage.offsetHeight);
  stage.style.transform = 'scale(' + stageScale + ')';
  fit.style.height = (stage.offsetHeight * stageScale) + 'px';
  fit.style.width = (DESIGN_W * stageScale) + 'px';
}

function cardEl(id) {
  var c = APP.task.cards.find(function (x) { return x.id === id; });
  var n = el('div', { class: 'msk-card', 'data-card': String(id) });
  n.textContent = c.display || c.text;
  n.addEventListener('pointerdown', onGrab);
  return n;
}

function render() {
  var t = APP.task;
  $('#tabLv').textContent = 'レベル:' + t.lv;
  $('#tabAsg').textContent = 'もんだい:' + t.asg;
  $('#req').textContent = t.requirement.display || t.requirement.text;

  var board = $('#board');
  board.innerHTML = '';
  ['1', '2', '3'].forEach(function (mark, i) {   // 丸は CSS の枠で描く（丸囲み数字だと二重になる）
    var slot = el('div', { class: 'msk-slot', 'data-slot': String(i) });
    if (APP.slots[i]) slot.appendChild(cardEl(APP.slots[i]));
    board.appendChild(el('div', { class: 'msk-row' }, [el('div', { class: 'msk-num' }, mark), slot]));
  });

  var list = $('#cardlist');
  list.innerHTML = '';
  APP.tray.forEach(function (cid, i) {
    var pos = el('div', { class: 'msk-pos', 'data-pos': String(i) });
    if (cid) pos.appendChild(cardEl(cid));
    list.appendChild(pos);
  });

  var ready = APP.slots.every(function (s) { return s > 0; });
  var btn = $('#action');
  btn.textContent = ready ? 'こたえあわせ' : 'カードをならべよう';
  btn.className = 'msk-action' + (ready ? ' ready' : '');
  fitStage();
}

// ---------------------------------------------------------------------------
// ドラッグ＆ドロップ（マウスでもタッチでも動くよう pointer イベントで実装）
// ---------------------------------------------------------------------------
var DRAG = { on: false, pointerId: null, id: 0, from: null, ghost: null, x0: 0, y0: 0, moved: false,
             target: null, node: null };

function onGrab(ev) {
  if (ev.button !== undefined && ev.button !== 0) return;
  if (APP.solved) return;
  // ドラッグ中に別の指で触れても新しいドラッグを始めない（前のゴーストが画面に取り残されるため）
  if (DRAG.on) return;
  var node = ev.currentTarget;
  var slotEl = node.closest('.msk-slot');
  var posEl = node.closest('.msk-pos');
  DRAG.on = true;
  DRAG.pointerId = ev.pointerId;
  DRAG.id = Number(node.dataset.card);
  DRAG.from = slotEl ? { kind: 'slot', index: Number(slotEl.dataset.slot) }
                     : { kind: 'tray', index: Number(posEl.dataset.pos) };
  DRAG.x0 = ev.clientX; DRAG.y0 = ev.clientY; DRAG.moved = false;

  var rect = node.getBoundingClientRect();   // 拡縮後の実寸
  var g = el('div', { class: 'msk-ghost' });
  g.textContent = node.textContent;
  g.style.width = (rect.width / stageScale) + 'px';
  g.style.height = (rect.height / stageScale) + 'px';
  g.style.transformOrigin = 'top left';
  // 傾けない。傾けたゴーストが取り残されると「カードが斜めになった」ように見えるため
  g.style.transform = 'scale(' + stageScale + ')';
  g.style.left = rect.left + 'px';
  g.style.top = rect.top + 'px';
  DRAG.offX = ev.clientX - rect.left;
  DRAG.offY = ev.clientY - rect.top;
  document.body.appendChild(g);
  DRAG.ghost = g;
  node.classList.add('dragging');
  DRAG.node = node;

  // 指が作問画面の外（GAS の iframe の外を含む）へ出ても続きのイベントを受け取る
  try { $('#stage').setPointerCapture(ev.pointerId); } catch (e) { /* 取れなくても動く */ }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onDrop);
  // タッチではブラウザがスクロール等のためにドラッグを打ち切ることがある（pointercancel）。
  // 受けないとゴーストと薄いカードが残る。打ち切られたら何も動かさずに元へ戻す。
  window.addEventListener('pointercancel', onCancel);
  window.addEventListener('blur', onCancel);
  ev.preventDefault();
}

function onMove(ev) {
  if (!DRAG.on || ev.pointerId !== DRAG.pointerId) return;
  if (Math.abs(ev.clientX - DRAG.x0) > 5 || Math.abs(ev.clientY - DRAG.y0) > 5) DRAG.moved = true;
  DRAG.ghost.style.left = (ev.clientX - DRAG.offX) + 'px';
  DRAG.ghost.style.top = (ev.clientY - DRAG.offY) + 'px';
  var t = dropTargetAt(ev.clientX, ev.clientY);
  if (DRAG.target !== t) {
    $$('.over').forEach(function (n) { n.classList.remove('over'); });
    if (t) t.classList.add('over');
    DRAG.target = t;
  }
}

/** ドラッグの後始末（ゴースト・薄いカード・ハイライト・リスナー）。落とし先の処理はしない。 */
function endDrag() {
  window.removeEventListener('pointermove', onMove);
  window.removeEventListener('pointerup', onDrop);
  window.removeEventListener('pointercancel', onCancel);
  window.removeEventListener('blur', onCancel);
  try { $('#stage').releasePointerCapture(DRAG.pointerId); } catch (e) { /* 取っていなければ何もしない */ }
  $$('.over').forEach(function (n) { n.classList.remove('over'); });
  $$('.msk-ghost').forEach(function (n) { n.remove(); });
  $$('.msk-card.dragging').forEach(function (n) { n.classList.remove('dragging'); });
  DRAG.on = false; DRAG.pointerId = null; DRAG.ghost = null; DRAG.target = null; DRAG.node = null;
}

function onCancel(ev) {
  if (!DRAG.on) return;
  if (ev && ev.type === 'pointercancel' && ev.pointerId !== DRAG.pointerId) return;
  endDrag();
}

function dropTargetAt(x, y) {
  var stack = document.elementsFromPoint(x, y);
  for (var i = 0; i < stack.length; i++) {
    var n = stack[i];
    if (n.classList && (n.classList.contains('msk-slot') || n.classList.contains('msk-pos'))) return n;
    if (n.id === 'cardlist') return n;
  }
  return null;
}

function onDrop(ev) {
  if (!DRAG.on || ev.pointerId !== DRAG.pointerId) return;
  var target = dropTargetAt(ev.clientX, ev.clientY);
  var id = DRAG.id, from = DRAG.from;
  endDrag();

  if (!DRAG.moved) return tap(id, from);          // ほぼ動いていなければクリック扱い
  if (!target) return;                             // どこにも落とさなかった → 何もしない
  if (target.classList.contains('msk-slot')) placeInSlot(id, from, Number(target.dataset.slot));
  else returnToTray(id, from);
}

/** クリック（タップ）: 選択肢なら空いている先頭の行へ、黒板の上なら選択肢へ戻す */
function tap(id, from) {
  if (from.kind === 'slot') return returnToTray(id, from);
  var empty = APP.slots.indexOf(0);
  if (empty < 0) return;
  placeInSlot(id, from, empty);
}

boot();
</script>
